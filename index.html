<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">

<title>Томас ❤️ Яна</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
*{box-sizing:border-box}

body{
 margin:0;
 background:#08090d;
 color:#fff;
 font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif
}

button,input{
 font:inherit
}

button{
 cursor:pointer
}

.hidden{
 display:none!important
}

#app{
 max-width:1050px;
 margin:auto;
 padding:14px
}

/* HOME */

.home{
 max-width:430px;
 margin:70px auto
}

.logo{
 text-align:center;
 font-size:30px;
 font-weight:900
}

.sub{
 text-align:center;
 color:#858c9a;
 margin:7px 0 25px
}

.card{
 background:#11131a;
 border:1px solid #292d38;
 border-radius:20px;
 padding:20px
}

label{
 display:block;
 color:#9299a7;
 font-size:13px;
 margin-bottom:7px
}

input{
 width:100%;
 padding:14px;
 border-radius:11px;
 border:1px solid #343844;
 background:#080a0f;
 color:#fff;
 outline:none
}

input:focus{
 border-color:#777cff
}

button{
 border:0;
 border-radius:11px;
 padding:14px;
 margin-top:10px;
 background:#fff;
 color:#000;
 font-weight:800
}

.darkBtn{
 background:#1b1f28;
 color:#fff
}

.info{
 margin-top:12px;
 color:#9299a7;
 font-size:13px;
 text-align:center;
 word-break:break-word
}

.error{
 color:#ff747e
}

.success{
 color:#70dfa0
}

/* ROOM */

.roomHead{
 display:flex;
 justify-content:space-between;
 align-items:center;
 margin:7px 0 14px;
 gap:10px
}

.roomTitle{
 font-size:22px;
 font-weight:900
}

.roomCode{
 color:#858c9a;
 font-size:12px;
 margin-top:3px
}

.roomCode b{
 color:#fff;
 letter-spacing:3px
}

.leave{
 width:auto;
 margin:0;
 background:#29171b;
 color:#ff9da5
}

.layout{
 display:grid;
 grid-template-columns:minmax(0,1fr) 310px;
 gap:14px
}

/* VIDEO */

.video{
 width:100%;
 aspect-ratio:16/9;
 background:#000;
 border-radius:16px;
 overflow:hidden;
 display:flex;
 align-items:center;
 justify-content:center;
 text-align:center;
 color:#747c8b
}

.video iframe{
 width:100%;
 height:100%;
 border:0
}

.videoEmpty{
 line-height:1.5
}

/* SEARCH */

.searchBox{
 margin-top:10px;
 background:#11131a;
 border:1px solid #292d38;
 border-radius:15px;
 padding:12px
}

.searchRow{
 display:flex;
 gap:7px
}

.searchRow input{
 min-width:0
}

.searchRow button{
 width:52px;
 margin:0;
 padding:0
}

.searchHint{
 margin-top:8px;
 font-size:11px;
 color:#707887
}

.results{
 margin-top:10px;
 display:flex;
 flex-direction:column;
 gap:7px
}

.result{
 display:flex;
 align-items:center;
 gap:10px;
 padding:9px;
 border-radius:11px;
 background:#191d25;
 border:1px solid #282d38
}

.resultIcon{
 width:50px;
 height:40px;
 border-radius:7px;
 background:#252a34;
 display:flex;
 align-items:center;
 justify-content:center;
 flex-shrink:0
}

.resultInfo{
 flex:1;
 min-width:0
}

.resultTitle{
 font-size:13px;
 font-weight:800;
 white-space:nowrap;
 overflow:hidden;
 text-overflow:ellipsis
}

.resultText{
 font-size:11px;
 color:#858c99;
 margin-top:3px
}

.watch{
 width:auto;
 margin:0;
 padding:8px 10px;
 background:#fff;
 color:#000;
 font-size:12px
}

/* CHAT */

.box{
 background:#11131a;
 border:1px solid #292d38;
 border-radius:15px;
 padding:13px
}

.boxTitle{
 font-weight:900;
 margin-bottom:10px
}

.users{
 display:flex;
 flex-wrap:wrap;
 gap:6px
}

.user{
 background:#1b2029;
 padding:7px 10px;
 border-radius:20px;
 font-size:13px
}

.chat{
 height:380px;
 margin-top:12px;
 display:flex;
 flex-direction:column
}

.messages{
 flex:1;
 overflow-y:auto;
 display:flex;
 flex-direction:column;
 gap:7px
}

.message{
 background:#1b1f28;
 padding:8px 10px;
 border-radius:9px;
 font-size:13px;
 word-break:break-word
}

.messageName{
 color:#9299a7;
 font-size:11px;
 font-weight:700;
 margin-bottom:3px
}

.send{
 display:flex;
 gap:6px;
 margin-top:8px
}

.send input{
 min-width:0
}

.send button{
 width:48px;
 margin:0;
 padding:0
}

/* MODAL */

.modal{
 position:fixed;
 inset:0;
 background:#000c;
 display:flex;
 align-items:center;
 justify-content:center;
 padding:18px;
 z-index:20
}

.modalCard{
 width:100%;
 max-width:390px
}

.close{
 float:right;
 width:auto;
 background:none;
 color:#888;
 font-size:25px;
 margin:0
}

@media(max-width:760px){

 .layout{
  grid-template-columns:1fr
 }

 .home{
  margin:40px auto
 }

 .chat{
  height:300px
 }

}
</style>
</head>

<body>

<div id="app">

<!-- HOME -->

<section id="home">

 <div class="home">

  <div class="logo">
   Томас ❤️ Яна
  </div>

  <div class="sub">
   Смотрим вместе
  </div>

  <div class="card">

   <label>Имя</label>

   <input
    id="name"
    maxlength="20"
    placeholder="Томас"
    autocomplete="off"
   >

   <button id="createBtn">
    ❤️ Создать комнату
   </button>

   <button
    id="joinBtn"
    class="darkBtn"
   >
    🔑 Войти по коду
   </button>

   <div
    id="homeStatus"
    class="info"
   ></div>

  </div>

 </div>

</section>


<!-- ROOM -->

<section
 id="room"
 class="hidden"
>

 <div class="roomHead">

  <div>

   <div class="roomTitle">
    Томас ❤️ Яна
   </div>

   <div class="roomCode">
    Комната:
    <b id="roomCode"></b>
   </div>

  </div>

  <button
   id="leaveBtn"
   class="leave"
  >
   Выйти
  </button>

 </div>


 <div class="layout">

  <main>

   <!-- VIDEO -->

   <div
    id="video"
    class="video"
   >
    <div class="videoEmpty">
     🎬<br><br>
     Найдите видео ниже
    </div>
   </div>


   <!-- SEARCH -->

   <div class="searchBox">

    <div class="searchRow">

     <input
      id="search"
      placeholder="🔎 Найти видео..."
      autocomplete="off"
     >

     <button id="searchBtn">
      🔍
     </button>

    </div>

    <div class="searchHint">
     Поиск подготовлен для подключения VK Video API.
     Сейчас можно выбирать видео по ссылке.
    </div>

    <div
     id="results"
     class="results"
    ></div>

   </div>


   <!-- DIRECT URL FALLBACK -->

   <div
    style="
     margin-top:8px;
     background:#11131a;
     border:1px solid #292d38;
     border-radius:12px;
     padding:10px
    "
   >

    <div
     style="
      color:#858c99;
      font-size:11px;
      margin-bottom:6px
     "
    >
     Пока поиск VK API не подключён — можно вставить embed-ссылку:
    </div>

    <div class="searchRow">

     <input
      id="videoUrl"
      placeholder="VK embed / iframe"
     >

     <button id="openVideo">
      ▶
     </button>

    </div>

   </div>


   <div
    id="roomStatus"
    class="info"
   ></div>


   <!-- CHAT -->

   <div class="box chat">

    <div class="boxTitle">
     💬 Чат
    </div>

    <div
     id="messages"
     class="messages"
    ></div>

    <div class="send">

     <input
      id="message"
      maxlength="300"
      placeholder="Написать..."
     >

     <button id="sendBtn">
      ➤
     </button>

    </div>

   </div>

  </main>


  <aside>

   <div class="box">

    <div class="boxTitle">
     👥 В комнате
    </div>

    <div
     id="users"
     class="users"
    ></div>

   </div>

  </aside>

 </div>

</section>

</div>


<!-- JOIN MODAL -->

<div
 id="joinModal"
 class="modal hidden"
>

 <div class="card modalCard">

  <button
   id="closeJoin"
   class="close"
  >
   ×
  </button>

  <h2>
   Войти в комнату
  </h2>

  <label>
   Код комнаты
  </label>

  <input
   id="joinCode"
   maxlength="6"
   placeholder="ABC123"
   style="text-transform:uppercase"
  >

  <button id="confirmJoin">
   Войти
  </button>

  <div
   id="joinStatus"
   class="info"
  ></div>

 </div>

</div>


<script>

/* ==========================================
   SUPABASE
========================================== */

const SUPABASE_URL=
"https://qyjvkiusyiylckaujjiv.supabase.co";

const SUPABASE_KEY=
"sb_publishable_dwxrSiVkIY5C8PKu--_UlA_phF5hvRy";

const db=
window.supabase.createClient(
 SUPABASE_URL,
 SUPABASE_KEY
);


/* ==========================================
   STATE
========================================== */

let room=null;
let currentName="";
let realtime=null;


/* ==========================================
   HELPERS
========================================== */

const $=id=>
 document.getElementById(id);


function setHome(text,type=""){

 $("homeStatus").textContent=text;

 $("homeStatus").className=
  "info "+type;

}


function setRoom(text,type=""){

 $("roomStatus").textContent=text;

 $("roomStatus").className=
  "info "+type;

}


function setJoin(text,type=""){

 $("joinStatus").textContent=text;

 $("joinStatus").className=
  "info "+type;

}


/* ==========================================
   ROOM CODE
========================================== */

function makeCode(){

 const chars=
 "ABCDEFGHJKLMNPQRSTUVWXYZ23456789";

 let code="";

 for(let i=0;i<6;i++){

  code+=chars[
   Math.floor(
    Math.random()*chars.length
   )
  ];

 }

 return code;

}


/* ==========================================
   CREATE
========================================== */

async function createRoom(){

 const name=
  $("name").value.trim();


 if(!name){

  setHome(
   "❌ Введи имя",
   "error"
  );

  return;

 }


 currentName=
  name.substring(0,20);


 $("createBtn").disabled=true;

 setHome(
  "⏳ Создаём комнату..."
 );


 try{

  const result=
   await db
    .from("rooms")
    .insert({

     code:makeCode(),

     host_name:currentName,

     video_url:"",

     is_playing:false

    })
    .select()
    .single();


  if(result.error)
   throw result.error;


  room=result.data;


  const user=
   await db
    .from("room_users")
    .insert({

     room_id:room.id,

     user_name:currentName

    });


  if(user.error)
   throw user.error;


  openRoom();


 }catch(error){

  console.error(error);

  setHome(
   "❌ "+error.message,
   "error"
  );

 }finally{

  $("createBtn").disabled=false;

 }

}


/* ==========================================
   JOIN
========================================== */

$("joinBtn").onclick=()=>{

 $("joinModal")
  .classList.remove("hidden");

 $("joinCode").focus();

};


$("closeJoin").onclick=()=>{

 $("joinModal")
  .classList.add("hidden");

};


async function joinRoom(){

 const name=
  $("name").value.trim();


 if(!name){

  setJoin(
   "Сначала введи имя",
   "error"
  );

  return;

 }


 const code=
  $("joinCode")
   .value
   .trim()
   .toUpperCase();


 if(code.length!==6){

  setJoin(
   "❌ Код должен быть из 6 символов",
   "error"
  );

  return;

 }


 currentName=
  name.substring(0,20);


 setJoin(
  "⏳ Ищем комнату..."
 );


 try{

  const result=
   await db
    .from("rooms")
    .select("*")
    .eq("code",code)
    .maybeSingle();


  if(result.error)
   throw result.error;


  if(!result.data){

   setJoin(
    "❌ Комната не найдена",
    "error"
   );

   return;

  }


  room=result.data;


  const user=
   await db
    .from("room_users")
    .insert({

     room_id:room.id,

     user_name:currentName

    });


  if(user.error)
   throw user.error;


  $("joinModal")
   .classList.add("hidden");


  openRoom();


 }catch(error){

  setJoin(
   "❌ "+error.message,
   "error"
  );

 }

}


/* ==========================================
   OPEN ROOM
========================================== */

async function openRoom(){

 $("home")
  .classList.add("hidden");

 $("room")
  .classList.remove("hidden");


 $("roomCode").textContent=
  room.code;


 if(room.video_url)
  renderVideo(
   room.video_url
  );


 await loadUsers();

 await loadMessages();

 subscribeRealtime();

}


/* ==========================================
   SEARCH
========================================== */

function searchVideo(){

 const query=
  $("search")
   .value
   .trim();


 if(!query){

  setRoom(
   "Введите название видео."
  );

  return;

 }


 /*
  В этой лёгкой версии мы НЕ делаем
  фальшивый запрос к VK.

  Показываем поисковую карточку,
  куда можно вставить embed.
 */

 $("results").innerHTML="";


 const result=
  document.createElement("div");

 result.className="result";


 result.innerHTML=`
  <div class="resultIcon">🎬</div>

  <div class="resultInfo">
   <div class="resultTitle">
    ${escapeHtml(query)}
   </div>

   <div class="resultText">
    Результат VK Video
   </div>
  </div>

  <button class="watch">
   Выбрать
  </button>
 `;


 result
  .querySelector(".watch")
  .onclick=()=>{

   setRoom(
    "Вставь embed-код этого видео в поле ниже."
   );

   $("videoUrl").focus();

  };


 $("results")
  .appendChild(result);


 setRoom(
  "🔎 Поиск готов. Для настоящего поиска VK подключим VK API."
 );

}


$("searchBtn").onclick=
 searchVideo;


$("search").addEventListener(
 "keydown",
 e=>{

  if(e.key==="Enter")
   searchVideo();

 }
);


/* ==========================================
   ESCAPE
========================================== */

function escapeHtml(text){

 return text
  .replaceAll("&","&amp;")
  .replaceAll("<","&lt;")
  .replaceAll(">","&gt;")
  .replaceAll('"',"&quot;")
  .replaceAll("'","&#039;");

}


/* ==========================================
   VIDEO
========================================== */

function renderVideo(value){

 if(!value){

  $("video").innerHTML=`
   <div class="videoEmpty">
    🎬<br><br>
    Найдите видео ниже
   </div>
  `;

  return;

 }


 let src=value.trim();


 /*
  Если вставлен iframe
 */

 if(src.includes("<iframe")){

  const match=
   src.match(
    /src=["']([^"']+)["']/
   );

  if(match)
   src=match[1];

 }


 /*
  Разрешаем только embed / HTTPS
 */

 if(
  !src.startsWith("https://") &&
  !src.startsWith("http://")
 ){

  $("video").innerHTML=`
   <div class="videoEmpty">
    ❌ Неверный embed-адрес
   </div>
  `;

  return;

 }


 const iframe=
  document.createElement("iframe");


 iframe.src=src;

 iframe.allow=
  "autoplay; fullscreen; encrypted-media; picture-in-picture";

 iframe.allowFullscreen=true;


 $("video").innerHTML="";

 $("video")
  .appendChild(iframe);

}


/* ==========================================
   SAVE VIDEO
========================================== */

$("openVideo").onclick=
 async()=>{

  if(!room)return;


  const value=
   $("videoUrl")
    .value
    .trim();


  if(!value){

   setRoom(
    "❌ Вставь embed-ссылку или iframe.",
    "error"
   );

   return;

  }


  const result=
   await db
    .from("rooms")
    .update({
     video_url:value
    })
    .eq(
     "id",
     room.id
    )
    .select()
    .single();


  if(result.error){

   setRoom(
    "❌ "+result.error.message,
    "error"
   );

   return;

  }


  room=result.data;

  renderVideo(value);

  setRoom(
   "🎬 Видео выбрано. Оно синхронизировано с комнатой.",
   "success"
  );

};


/* ==========================================
   USERS
========================================== */

async function loadUsers(){

 if(!room)return;


 const result=
  await db
   .from("room_users")
   .select("*")
   .eq(
    "room_id",
    room.id
   )
   .order(
    "created_at",
    {ascending:true}
   );


 if(result.error){

  console.error(result.error);

  return;

 }


 $("users").innerHTML="";


 (result.data||[])
  .forEach(user=>{

   const el=
    document.createElement("div");

   el.className="user";

   el.textContent=
    "🟢 "+user.user_name;

   $("users")
    .appendChild(el);

  });

}


/* ==========================================
   CHAT
========================================== */

async function loadMessages(){

 if(!room)return;


 const result=
  await db
   .from("messages")
   .select("*")
   .eq(
    "room_id",
    room.id
   )
   .order(
    "created_at",
    {ascending:true}
   )
   .limit(100);


 if(result.error){

  console.error(result.error);

  return;

 }


 $("messages").innerHTML="";


 (result.data||[])
  .forEach(renderMessage);


 scrollChat();

}


function renderMessage(item){

 const el=
  document.createElement("div");

 el.className="message";


 const n=
  document.createElement("div");

 n.className="messageName";

 n.textContent=
  item.user_name;


 const t=
  document.createElement("div");

 t.textContent=
  item.message;


 el.appendChild(n);

 el.appendChild(t);


 $("messages")
  .appendChild(el);

}


function scrollChat(){

 $("messages").scrollTop=
  $("messages").scrollHeight;

}


async function sendMessage(){

 if(!room)return;


 const input=
  $("message");


 const text=
  input.value.trim();


 if(!text)return;


 input.value="";


 const result=
  await db
   .from("messages")
   .insert({

    room_id:room.id,

    user_name:currentName,

    message:text

   });


 if(result.error){

  setRoom(
   "❌ "+result.error.message,
   "error"
  );

 }

}


$("sendBtn").onclick=
 sendMessage;


$("message").addEventListener(
 "keydown",
 e=>{

  if(e.key==="Enter")
   sendMessage();

 }
);


/* ==========================================
   REALTIME
========================================== */

function subscribeRealtime(){

 if(!room)return;


 realtime=
  db
   .channel(
    "room-"+room.id
   )

   .on(
    "postgres_changes",
    {
     event:"UPDATE",
     schema:"public",
     table:"rooms",
     filter:
      "id=eq."+room.id
    },
    payload=>{

     room=
      payload.new;


     if(room.video_url)
      renderVideo(
       room.video_url
      );

    }
   )

   .on(
    "postgres_changes",
    {
     event:"INSERT",
     schema:"public",
     table:"room_users",
     filter:
      "room_id=eq."+room.id
    },
    ()=>{
     loadUsers();
    }
   )

   .on(
    "postgres_changes",
    {
     event:"DELETE",
     schema:"public",
     table:"room_users",
     filter:
      "room_id=eq."+room.id
    },
    ()=>{
     loadUsers();
    }
   )

   .on(
    "postgres_changes",
    {
     event:"INSERT",
     schema:"public",
     table:"messages",
     filter:
      "room_id=eq."+room.id
    },
    payload=>{

     renderMessage(
      payload.new
     );

     scrollChat();

    }
   )

   .subscribe();

}


/* ==========================================
   LEAVE
========================================== */

$("leaveBtn").onclick=
 async()=>{

  if(room){

   await db
    .from("room_users")
    .delete()
    .eq(
     "room_id",
     room.id
    )
    .eq(
     "user_name",
     currentName
    );

  }


  if(realtime){

   await db
    .removeChannel(
     realtime
    );

  }


  room=null;


  $("room")
   .classList.add("hidden");

  $("home")
   .classList.remove("hidden");


  setHome(
   "Ты вышел из комнаты.",
   "success"
  );

};


/* ==========================================
   BUTTONS
========================================== */

$("createBtn").onclick=
 createRoom;

$("confirmJoin").onclick=
 joinRoom;


$("name").addEventListener(
 "keydown",
 e=>{

  if(e.key==="Enter")
   createRoom();

 }
);


$("joinCode").addEventListener(
 "keydown",
 e=>{

  if(e.key==="Enter")
   joinRoom();

 }
);

</script>

</body>
</html>
