<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<title>Томас ❤️ Яна</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
*{box-sizing:border-box}

body{
 margin:0;
 min-height:100vh;
 background:#08090d;
 color:#fff;
 font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif
}

button,input{
 font:inherit
}

#app{
 width:100%;
 max-width:900px;
 margin:auto;
 padding:20px
}

.card{
 max-width:430px;
 margin:60px auto;
 padding:24px;
 background:#11131a;
 border:1px solid #292d38;
 border-radius:20px
}

h1{
 text-align:center;
 margin:0;
 font-size:28px
}

.sub{
 text-align:center;
 color:#8d94a3;
 margin:8px 0 25px
}

label{
 display:block;
 color:#9ba1ae;
 font-size:13px;
 margin-bottom:7px
}

input{
 width:100%;
 padding:14px;
 border-radius:12px;
 border:1px solid #343844;
 background:#080a0f;
 color:white;
 outline:none
}

button{
 width:100%;
 margin-top:10px;
 padding:14px;
 border:0;
 border-radius:12px;
 background:white;
 color:#000;
 font-weight:800
}

button:disabled{
 opacity:.5
}

#status{
 margin-top:15px;
 padding:12px;
 border-radius:10px;
 background:#0b0d12;
 color:#aeb5c2;
 font-size:13px;
 line-height:1.5;
 word-break:break-word
}

.ok{
 color:#72e3a0!important
}

.err{
 color:#ff737e!important
}

.hidden{
 display:none!important
}

.room{
 max-width:900px;
 margin:30px auto
}

.roomHead{
 display:flex;
 justify-content:space-between;
 align-items:center;
 gap:15px;
 margin-bottom:15px
}

.roomTitle{
 font-size:22px;
 font-weight:900
}

.code{
 color:#999;
 font-size:13px;
 margin-top:4px
}

.code b{
 color:#fff;
 letter-spacing:3px
}

.video{
 width:100%;
 aspect-ratio:16/9;
 background:#000;
 border-radius:16px;
 display:flex;
 align-items:center;
 justify-content:center;
 color:#777;
 text-align:center;
 overflow:hidden
}

.video iframe{
 width:100%;
 height:100%;
 border:0
}

.videoTools{
 display:flex;
 gap:7px;
 margin-top:8px
}

.videoTools input{
 flex:1
}

.videoTools button{
 width:auto;
 margin:0;
 padding:0 18px
}

.chat{
 margin-top:15px;
 background:#11131a;
 border:1px solid #292d38;
 border-radius:15px;
 padding:14px
}

.messages{
 height:250px;
 overflow:auto;
 display:flex;
 flex-direction:column;
 gap:7px
}

.message{
 background:#1b1f28;
 border-radius:9px;
 padding:8px
}

.messageName{
 font-size:11px;
 color:#999;
 margin-bottom:3px
}

.send{
 display:flex;
 gap:7px;
 margin-top:8px
}

.send input{
 flex:1
}

.send button{
 width:50px;
 margin:0;
 padding:0
}

.leave{
 background:#29171b;
 color:#ff9da5;
 width:auto;
 padding:10px 15px;
 margin:0
}
</style>
</head>

<body>

<div id="app">

 <!-- HOME -->

 <div id="home" class="card">

  <h1>Томас ❤️ Яна</h1>

  <div class="sub">
   Комната для просмотра вместе
  </div>

  <label>Имя</label>

  <input
   id="name"
   maxlength="20"
   placeholder="Томас"
   autocomplete="off"
  >

  <button id="create">
   ❤️ Создать комнату
  </button>

  <button
   id="test"
   style="background:#1b1f28;color:white"
  >
   🔧 Проверить Supabase
  </button>

  <div id="status">
   Готово к проверке.
  </div>

 </div>


 <!-- ROOM -->

 <div id="room" class="room hidden">

  <div class="roomHead">

   <div>

    <div class="roomTitle">
     Томас ❤️ Яна
    </div>

    <div class="code">
     Код комнаты:
     <b id="code"></b>
    </div>

   </div>

   <button
    id="leave"
    class="leave"
   >
    Выйти
   </button>

  </div>


  <div
   id="video"
   class="video"
  >
   🎬<br><br>
   Вставь видео VK
  </div>


  <div class="videoTools">

   <input
    id="videoUrl"
    placeholder="Ссылка или iframe VK"
   >

   <button id="saveVideo">
    OK
   </button>

  </div>


  <div
   id="roomStatus"
   style="margin-top:10px;color:#888"
  ></div>


  <div class="chat">

   <b>💬 Чат</b>

   <div
    id="messages"
    class="messages"
    style="margin-top:10px"
   ></div>

   <div class="send">

    <input
     id="message"
     maxlength="300"
     placeholder="Написать..."
    >

    <button id="send">
     ➤
    </button>

   </div>

  </div>

 </div>

</div>


<script>

/* ==========================================
   SUPABASE
========================================== */

const SUPABASE_URL =
"https://qyjvkiusyiylckaujjiv.supabase.co";

const SUPABASE_KEY =
"sb_publishable_dwxrSiVkIY5C8PKu--_UlA_phF5hvRy";


const db =
window.supabase.createClient(
 SUPABASE_URL,
 SUPABASE_KEY
);


/* ==========================================
   STATE
========================================== */

let currentRoom=null;
let currentName="";

let channel=null;


/* ==========================================
   HELPERS
========================================== */

const $=id=>
 document.getElementById(id);


function status(text,type=""){

 $("status").textContent=text;

 $("status").className=type;

}


function roomStatus(text){

 $("roomStatus").textContent=text;

}


/* ==========================================
   SUPABASE TEST
========================================== */

async function testSupabase(){

 status(
  "⏳ Проверяем подключение к Supabase..."
 );


 try{

  const result=
   await db
    .from("rooms")
    .select("id")
    .limit(1);


  if(result.error){

   throw result.error;

  }


  status(
   "🟢 Supabase подключён! Таблица rooms доступна.",
   "ok"
  );


 }catch(error){

  console.error(error);

  status(
   "🔴 Supabase ERROR: "+
   (error.message || error),
   "err"
  );

 }

}


/* ==========================================
   CODE
========================================== */

function generateCode(){

 const chars=
 "ABCDEFGHJKLMNPQRSTUVWXYZ23456789";

 let result="";

 for(let i=0;i<6;i++){

  result+=chars[
   Math.floor(
    Math.random()*chars.length
   )
  ];

 }

 return result;

}


/* ==========================================
   CREATE ROOM
========================================== */

async function createRoom(){

 const name=
  $("name").value.trim();


 if(!name){

  status(
   "🔴 Сначала введи имя.",
   "err"
  );

  $("name").focus();

  return;

 }


 currentName=
  name.substring(0,20);


 const button=
  $("create");

 button.disabled=true;


 status(
  "⏳ 1/4 Проверяем Supabase..."
 );


 try{

  /* 1 */

  const check=
   await db
    .from("rooms")
    .select("id")
    .limit(1);


  if(check.error){

   throw new Error(
    "rooms недоступна: "+
    check.error.message
   );

  }


  status(
   "🟢 2/4 Таблица rooms работает..."
  );


  /* 2 */

  const code=
   generateCode();


  status(
   "⏳ 3/4 Создаём комнату "+code+"..."
  );


  const result=
   await db
    .from("rooms")
    .insert({

     code:code,

     host_name:currentName,

     video_url:"",

     is_playing:false

    })
    .select()
    .single();


  if(result.error){

   throw new Error(
    "INSERT rooms: "+
    result.error.message
   );

  }


  currentRoom=
   result.data;


  status(
   "🟢 4/4 Комната создана. Добавляем тебя..."
  );


  const user=
   await db
    .from("room_users")
    .insert({

     room_id:currentRoom.id,

     user_name:currentName

    });


  if(user.error){

   throw new Error(
    "INSERT room_users: "+
    user.error.message
   );

  }


  status(
   "🟢 Комната успешно создана!",
   "ok"
  );


  openRoom();


 }catch(error){

  console.error(error);


  status(
   "🔴 ОШИБКА: "+
   (error.message || error),
   "err"
  );


 }finally{

  button.disabled=false;

 }

}


/* ==========================================
   OPEN ROOM
========================================== */

async function openRoom(){

 $("home")
  .classList.add("hidden");


 $("room")
  .classList.remove("hidden");


 $("code").textContent=
  currentRoom.code;


 loadMessages();

 subscribe();

}


/* ==========================================
   VIDEO
========================================== */

function showVideo(value){

 if(!value){

  $("video").innerHTML=
   "🎬<br><br>Вставь видео VK";

  return;

 }


 let src=
  value.trim();


 if(src.includes("<iframe")){

  const match=
   src.match(
    /src=["']([^"']+)["']/
   );

  if(match)
   src=match[1];

 }


 const iframe=
  document.createElement("iframe");


 iframe.src=src;

 iframe.allow=
  "autoplay; fullscreen; encrypted-media; picture-in-picture";

 iframe.allowFullscreen=true;


 $("video").innerHTML="";

 $("video")
  .appendChild(iframe);

}


$("saveVideo").onclick=
 async()=>{

  if(!currentRoom)return;


  const value=
   $("videoUrl")
    .value
    .trim();


  if(!value){

   roomStatus(
    "Вставь ссылку VK."
   );

   return;

  }


  const result=
   await db
    .from("rooms")
    .update({
     video_url:value
    })
    .eq(
     "id",
     currentRoom.id
    );


  if(result.error){

   roomStatus(
    "Ошибка: "+
    result.error.message
   );

   return;

  }


  showVideo(value);

  roomStatus(
   "🎬 Видео сохранено для комнаты."
  );

 };


/* ==========================================
   CHAT
========================================== */

async function loadMessages(){

 if(!currentRoom)return;


 const result=
  await db
   .from("messages")
   .select("*")
   .eq(
    "room_id",
    currentRoom.id
   )
   .order(
    "created_at",
    {ascending:true}
   );


 if(result.error){

  console.error(result.error);

  return;

 }


 $("messages").innerHTML="";


 (result.data||[])
  .forEach(renderMessage);


 scrollChat();

}


function renderMessage(item){

 const div=
  document.createElement("div");

 div.className=
  "message";


 const name=
  document.createElement("div");

 name.className=
  "messageName";

 name.textContent=
  item.user_name;


 const text=
  document.createElement("div");

 text.textContent=
  item.message;


 div.appendChild(name);

 div.appendChild(text);


 $("messages")
  .appendChild(div);

}


function scrollChat(){

 $("messages").scrollTop=
  $("messages").scrollHeight;

}


async function sendMessage(){

 if(!currentRoom)return;


 const input=
  $("message");


 const text=
  input.value.trim();


 if(!text)return;


 input.value="";


 const result=
  await db
   .from("messages")
   .insert({

    room_id:currentRoom.id,

    user_name:currentName,

    message:text

   });


 if(result.error){

  roomStatus(
   "Ошибка чата: "+
   result.error.message
  );

 }

}


$("send").onclick=
 sendMessage;


$("message").addEventListener(
 "keydown",
 e=>{

  if(e.key==="Enter")
   sendMessage();

 }
);


/* ==========================================
   REALTIME
========================================== */

function subscribe(){

 if(!currentRoom)return;


 channel=
  db
   .channel(
    "room-"+currentRoom.id
   )

   .on(
    "postgres_changes",
    {
     event:"UPDATE",
     schema:"public",
     table:"rooms",
     filter:
      "id=eq."+currentRoom.id
    },
    payload=>{

     currentRoom=
      payload.new;


     if(
      payload.new.video_url
     ){

      $("videoUrl").value=
       payload.new.video_url;

      showVideo(
       payload.new.video_url
      );

     }

    }
   )

   .on(
    "postgres_changes",
    {
     event:"INSERT",
     schema:"public",
     table:"messages",
     filter:
      "room_id=eq."+currentRoom.id
    },
    payload=>{

     renderMessage(
      payload.new
     );

     scrollChat();

    }
   )

   .subscribe();

}


/* ==========================================
   LEAVE
========================================== */

$("leave").onclick=
 async()=>{

  if(currentRoom){

   await db
    .from("room_users")
    .delete()
    .eq(
     "room_id",
     currentRoom.id
    )
    .eq(
     "user_name",
     currentName
    );

  }


  if(channel){

   await db
    .removeChannel(channel);

  }


  currentRoom=null;


  $("room")
   .classList.add("hidden");

  $("home")
   .classList.remove("hidden");


  status(
   "Ты вышел из комнаты."
  );

 };


/* ==========================================
   EVENTS
========================================== */

$("test").onclick=
 testSupabase;

$("create").onclick=
 createRoom;


$("name").addEventListener(
 "keydown",
 e=>{

  if(e.key==="Enter")
   createRoom();

 }
);

</script>

</body>
</html>
