<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Томас ❤️ Яна</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
*{box-sizing:border-box}

body{
 margin:0;
 min-height:100vh;
 background:#08090d;
 color:#fff;
 font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif
}

button,input{
 font:inherit
}

button{
 cursor:pointer
}

.hidden{
 display:none!important
}

#app{
 max-width:1000px;
 margin:auto;
 padding:15px
}

/* HOME */

.home{
 max-width:430px;
 margin:65px auto
}

.logo{
 text-align:center;
 font-size:30px;
 font-weight:900
}

.subtitle{
 text-align:center;
 color:#858c9b;
 margin:7px 0 25px
}

.card{
 background:#11131a;
 border:1px solid #292d38;
 border-radius:20px;
 padding:20px
}

label{
 display:block;
 color:#9299a7;
 font-size:13px;
 margin-bottom:7px
}

input{
 width:100%;
 padding:14px;
 background:#080a0f;
 border:1px solid #343844;
 border-radius:11px;
 color:#fff;
 outline:none
}

input:focus{
 border-color:#777cff
}

button{
 border:0;
 border-radius:11px;
 padding:14px;
 margin-top:10px;
 font-weight:800;
 background:#fff;
 color:#000
}

.secondary{
 background:#1c2029;
 color:#fff;
 border:1px solid #303541
}

.info{
 margin-top:12px;
 min-height:20px;
 text-align:center;
 font-size:13px;
 color:#9299a7;
 word-break:break-word
}

.error{
 color:#ff7781
}

.success{
 color:#72dfa0
}

/* ROOM */

.roomHead{
 display:flex;
 align-items:center;
 justify-content:space-between;
 gap:10px;
 margin:8px 0 15px
}

.roomTitle{
 font-size:22px;
 font-weight:900
}

.roomCode{
 color:#858c9a;
 font-size:13px;
 margin-top:3px
}

.roomCode b{
 color:#fff;
 letter-spacing:3px
}

.leave{
 width:auto;
 margin:0;
 background:#29171b;
 color:#ff9da5
}

.layout{
 display:grid;
 grid-template-columns:minmax(0,1fr) 300px;
 gap:14px
}

/* VIDEO */

.video{
 width:100%;
 aspect-ratio:16/9;
 background:#000;
 border-radius:16px;
 overflow:hidden;
 display:flex;
 justify-content:center;
 align-items:center;
 text-align:center;
 color:#777f8e;
 padding:20px
}

.video iframe{
 width:100%;
 height:100%;
 border:0
}

.videoInfo{
 color:#858c99;
 line-height:1.5
}

.videoTools{
 display:flex;
 gap:7px;
 margin-top:9px
}

.videoTools input{
 min-width:0;
 flex:1
}

.videoTools button{
 width:auto;
 margin:0;
 padding:0 18px
}

.hint{
 color:#777f8e;
 font-size:11px;
 margin-top:7px
}

/* SIDE */

.box{
 background:#11131a;
 border:1px solid #292d38;
 border-radius:15px;
 padding:13px
}

.boxTitle{
 font-weight:900;
 margin-bottom:10px
}

.users{
 display:flex;
 flex-wrap:wrap;
 gap:6px
}

.user{
 background:#1b2029;
 border-radius:20px;
 padding:7px 10px;
 font-size:13px
}

/* CHAT */

.chat{
 height:360px;
 display:flex;
 flex-direction:column;
 margin-top:12px
}

.messages{
 flex:1;
 overflow-y:auto;
 display:flex;
 flex-direction:column;
 gap:7px
}

.message{
 background:#1b1f28;
 padding:8px 10px;
 border-radius:9px;
 font-size:13px;
 word-break:break-word
}

.messageName{
 color:#9299a7;
 font-size:11px;
 font-weight:700;
 margin-bottom:3px
}

.send{
 display:flex;
 gap:6px;
 margin-top:8px
}

.send input{
 min-width:0;
 flex:1
}

.send button{
 width:48px;
 margin:0;
 padding:0
}

@media(max-width:720px){

 .layout{
  grid-template-columns:1fr
 }

 .home{
  margin:40px auto
 }

 .chat{
  height:300px
 }

}

@media(max-width:430px){

 #app{
  padding:10px
 }

 .logo{
  font-size:27px
 }

}
</style>
</head>

<body>

<div id="app">

<!-- HOME -->

<section id="home">

 <div class="home">

  <div class="logo">
   Томас ❤️ Яна
  </div>

  <div class="subtitle">
   Смотрим вместе
  </div>

  <div class="card">

   <label>Имя</label>

   <input
    id="name"
    maxlength="20"
    placeholder="Томас"
    autocomplete="off"
   >

   <button id="createBtn">
    ❤️ Создать комнату
   </button>

   <button
    id="joinBtn"
    class="secondary"
   >
    🔑 Войти по коду
   </button>

   <div
    id="homeStatus"
    class="info"
   ></div>

  </div>

 </div>

</section>


<!-- ROOM -->

<section
 id="room"
 class="hidden"
>

 <div class="roomHead">

  <div>

   <div class="roomTitle">
    Томас ❤️ Яна
   </div>

   <div class="roomCode">
    Код:
    <b id="roomCode"></b>
   </div>

  </div>

  <button
   id="leaveBtn"
   class="leave"
  >
   Выйти
  </button>

 </div>


 <div class="layout">

  <main>

   <div
    id="video"
    class="video"
   >
    <div class="videoInfo">
     🎬<br><br>
     Вставь ссылку на VK Video
    </div>
   </div>


   <div class="videoTools">

    <input
     id="videoUrl"
     placeholder="https://vk.com/video..."
    >

    <button id="videoBtn">
     Смотреть
    </button>

   </div>

   <div class="hint">
    Можно вставить ссылку VK Video или готовый iframe-код VK.
   </div>


   <div
    id="roomStatus"
    class="info"
   ></div>


   <div class="box chat">

    <div class="boxTitle">
     💬 Чат
    </div>

    <div
     id="messages"
     class="messages"
    ></div>

    <div class="send">

     <input
      id="message"
      maxlength="300"
      placeholder="Написать..."
     >

     <button id="sendBtn">
      ➤
     </button>

    </div>

   </div>

  </main>


  <aside>

   <div class="box">

    <div class="boxTitle">
     👥 В комнате
    </div>

    <div
     id="users"
     class="users"
    ></div>

   </div>

  </aside>

 </div>

</section>

</div>


<!-- JOIN -->

<div
 id="joinModal"
 class="hidden"
 style="
  position:fixed;
  inset:0;
  background:#000c;
  display:flex;
  align-items:center;
  justify-content:center;
  padding:18px;
 "
>

 <div
  class="card"
  style="width:100%;max-width:390px"
 >

  <button
   id="closeJoin"
   style="
    float:right;
    width:auto;
    margin:0;
    padding:5px 10px;
    background:none;
    color:#888;
    font-size:25px
   "
  >
   ×
  </button>

  <h2>
   Войти в комнату
  </h2>

  <label>
   Код комнаты
  </label>

  <input
   id="joinCode"
   maxlength="6"
   placeholder="ABC123"
   style="text-transform:uppercase"
  >

  <button id="confirmJoin">
   Войти
  </button>

  <div
   id="joinStatus"
   class="info"
  ></div>

 </div>

</div>


<script>

/* =========================================
   SUPABASE
========================================= */

const SUPABASE_URL=
"https://qyjvkiusyiylckaujjiv.supabase.co";

const SUPABASE_KEY=
"sb_publishable_dwxrSiVkIY5C8PKu--_UlA_phF5hvRy";

const db=
window.supabase.createClient(
 SUPABASE_URL,
 SUPABASE_KEY
);


/* =========================================
   STATE
========================================= */

let room=null;
let name="";

let realtime=null;


/* =========================================
   HELPERS
========================================= */

const $=id=>
 document.getElementById(id);


function homeStatus(text,type=""){

 $("homeStatus").textContent=text;

 $("homeStatus").className=
  "info "+type;

}


function roomStatus(text,type=""){

 $("roomStatus").textContent=text;

 $("roomStatus").className=
  "info "+type;

}


function joinStatus(text,type=""){

 $("joinStatus").textContent=text;

 $("joinStatus").className=
  "info "+type;

}


function code(){

 const chars=
 "ABCDEFGHJKLMNPQRSTUVWXYZ23456789";

 let result="";

 for(let i=0;i<6;i++){

  result+=chars[
   Math.floor(
    Math.random()*chars.length
   )
  ];

 }

 return result;

}


/* =========================================
   CREATE ROOM
========================================= */

async function createRoom(){

 const userName=
  $("name").value.trim();


 if(!userName){

  homeStatus(
   "❌ Введи имя",
   "error"
  );

  return;

 }


 name=
  userName.substring(0,20);


 $("createBtn").disabled=true;


 homeStatus(
  "⏳ Создаём комнату..."
 );


 try{

  const newCode=code();


  const result=
   await db
    .from("rooms")
    .insert({

     code:newCode,

     host_name:name,

     video_url:"",

     is_playing:false

    })
    .select()
    .single();


  if(result.error){

   throw new Error(
    result.error.message
   );

  }


  room=result.data;


  const user=
   await db
    .from("room_users")
    .insert({

     room_id:room.id,

     user_name:name

    });


  if(user.error){

   throw new Error(
    user.error.message
   );

  }


  openRoom();


 }catch(error){

  console.error(error);

  homeStatus(
   "❌ "+error.message,
   "error"
  );

 }finally{

  $("createBtn").disabled=false;

 }

}


/* =========================================
   JOIN
========================================= */

$("joinBtn").onclick=()=>{

 $("joinModal")
  .classList.remove("hidden");

 $("joinCode").focus();

};


$("closeJoin").onclick=()=>{

 $("joinModal")
  .classList.add("hidden");

};


async function joinRoom(){

 const userName=
  $("name").value.trim();


 if(!userName){

  joinStatus(
   "Сначала введи имя",
   "error"
  );

  $("joinModal")
   .classList.add("hidden");

  $("name").focus();

  return;

 }


 const roomCode=
  $("joinCode")
   .value
   .trim()
   .toUpperCase();


 if(roomCode.length!==6){

  joinStatus(
   "❌ Код должен быть из 6 символов",
   "error"
  );

  return;

 }


 name=
  userName.substring(0,20);


 joinStatus(
  "⏳ Ищем комнату..."
 );


 try{

  const result=
   await db
    .from("rooms")
    .select("*")
    .eq("code",roomCode)
    .maybeSingle();


  if(result.error){

   throw new Error(
    result.error.message
   );

  }


  if(!result.data){

   joinStatus(
    "❌ Комната не найдена",
    "error"
   );

   return;

  }


  room=result.data;


  const user=
   await db
    .from("room_users")
    .insert({

     room_id:room.id,

     user_name:name

    });


  if(user.error){

   throw new Error(
    user.error.message
   );

  }


  $("joinModal")
   .classList.add("hidden");


  openRoom();


 }catch(error){

  joinStatus(
   "❌ "+error.message,
   "error"
  );

 }

}


/* =========================================
   OPEN ROOM
========================================= */

async function openRoom(){

 $("home")
  .classList.add("hidden");

 $("room")
  .classList.remove("hidden");


 $("roomCode").textContent=
  room.code;


 $("videoUrl").value=
  room.video_url || "";


 if(room.video_url)
  showVideo(room.video_url);


 await loadUsers();

 await loadMessages();

 subscribe();

}


/* =========================================
   VK VIDEO
========================================= */

function showVideo(value){

 let src=
  value.trim();


 /*
  Если пользователь вставил iframe VK,
  вытаскиваем src.
 */

 if(src.includes("<iframe")){

  const match=
   src.match(
    /src=["']([^"']+)["']/
   );

  if(match)
   src=match[1];

 }


 /*
  Если это уже embed-ссылка
 */

 if(
  src.includes("vk.com/video_ext.php") ||
  src.includes("vk.ru/video_ext.php")
 ){

  createPlayer(src);

  return;

 }


 /*
  Обычная ссылка VK.
  Саму страницу vk.com/video...
  нельзя надёжно вставить в iframe.
 */

 if(
  src.includes("vk.com/video") ||
  src.includes("vk.ru/video")
 ){

  $("video").innerHTML=`
   <div class="videoInfo">
    ⚠️ Это обычная ссылка VK Video.<br><br>
    Для встроенного просмотра нужен
    <b>iframe / embed-код VK</b>.<br><br>
    Открой видео VK → «Поделиться» →
    «Код для вставки» и вставь его сюда.
   </div>
  `;

  return;

 }


 /*
  Любой другой HTTPS iframe URL
 */

 if(
  src.startsWith("https://") ||
  src.startsWith("http://")
 ){

  createPlayer(src);

  return;

 }


 $("video").innerHTML=`
  <div class="videoInfo">
   ❌ Не удалось распознать ссылку.
  </div>
 `;

}


function createPlayer(src){

 const iframe=
  document.createElement("iframe");


 iframe.src=src;

 iframe.allow=
  "autoplay; fullscreen; encrypted-media; picture-in-picture";

 iframe.allowFullscreen=true;


 $("video").innerHTML="";

 $("video")
  .appendChild(iframe);

}


/* =========================================
   SAVE VIDEO
========================================= */

$("videoBtn").onclick=
 async()=>{

  if(!room)return;


  const value=
   $("videoUrl")
    .value
    .trim();


  if(!value){

   roomStatus(
    "❌ Вставь видео VK",
    "error"
   );

   return;

  }


  const result=
   await db
    .from("rooms")
    .update({
     video_url:value
    })
    .eq(
     "id",
     room.id
    )
    .select()
    .single();


  if(result.error){

   roomStatus(
    "❌ "+result.error.message,
    "error"
   );

   return;

  }


  room=result.data;

  showVideo(value);

  roomStatus(
   "🎬 Видео сохранено",
   "success"
  );

};


/* =========================================
   USERS
========================================= */

async function loadUsers(){

 if(!room)return;


 const result=
  await db
   .from("room_users")
   .select("*")
   .eq(
    "room_id",
    room.id
   )
   .order(
    "created_at",
    {ascending:true}
   );


 if(result.error){

  console.error(result.error);

  return;

 }


 $("users").innerHTML="";


 (result.data||[])
  .forEach(user=>{

   const el=
    document.createElement("div");

   el.className="user";

   el.textContent=
    "🟢 "+user.user_name;

   $("users")
    .appendChild(el);

  });

}


/* =========================================
   CHAT
========================================= */

async function loadMessages(){

 if(!room)return;


 const result=
  await db
   .from("messages")
   .select("*")
   .eq(
    "room_id",
    room.id
   )
   .order(
    "created_at",
    {ascending:true}
   )
   .limit(100);


 if(result.error){

  console.error(result.error);

  return;

 }


 $("messages").innerHTML="";


 (result.data||[])
  .forEach(renderMessage);


 scrollChat();

}


function renderMessage(item){

 const el=
  document.createElement("div");

 el.className="message";


 const user=
  document.createElement("div");

 user.className="messageName";

 user.textContent=
  item.user_name;


 const text=
  document.createElement("div");

 text.textContent=
  item.message;


 el.appendChild(user);

 el.appendChild(text);


 $("messages")
  .appendChild(el);

}


function scrollChat(){

 $("messages").scrollTop=
  $("messages").scrollHeight;

}


async function sendMessage(){

 if(!room)return;


 const input=
  $("message");

 const text=
  input.value.trim();


 if(!text)return;


 input.value="";


 const result=
  await db
   .from("messages")
   .insert({

    room_id:room.id,

    user_name:name,

    message:text

   });


 if(result.error){

  roomStatus(
   "❌ Чат: "+
   result.error.message,
   "error"
  );

 }

}


$("sendBtn").onclick=
 sendMessage;


$("message").addEventListener(
 "keydown",
 e=>{

  if(e.key==="Enter")
   sendMessage();

 }
);


/* =========================================
   REALTIME
========================================= */

function subscribe(){

 if(!room)return;


 realtime=
  db
   .channel(
    "room-"+room.id
   )

   .on(
    "postgres_changes",
    {
     event:"UPDATE",
     schema:"public",
     table:"rooms",
     filter:
      "id=eq."+room.id
    },
    payload=>{

     room=
      payload.new;


     $("videoUrl").value=
      room.video_url || "";


     if(room.video_url)
      showVideo(
       room.video_url
      );

    }
   )

   .on(
    "postgres_changes",
    {
     event:"INSERT",
     schema:"public",
     table:"room_users",
     filter:
      "room_id=eq."+room.id
    },
    ()=>{
     loadUsers();
    }
   )

   .on(
    "postgres_changes",
    {
     event:"DELETE",
     schema:"public",
     table:"room_users",
     filter:
      "room_id=eq."+room.id
    },
    ()=>{
     loadUsers();
    }
   )

   .on(
    "postgres_changes",
    {
     event:"INSERT",
     schema:"public",
     table:"messages",
     filter:
      "room_id=eq."+room.id
    },
    payload=>{

     /*
      Не дублируем собственное сообщение,
      если Realtime вернул его.
     */

     renderMessage(
      payload.new
     );

     scrollChat();

    }
   )

   .subscribe();

}


/* =========================================
   LEAVE
========================================= */

$("leaveBtn").onclick=
 async()=>{

  if(room){

   await db
    .from("room_users")
    .delete()
    .eq(
     "room_id",
     room.id
    )
    .eq(
     "user_name",
     name
    );

  }


  if(realtime){

   await db
    .removeChannel(
     realtime
    );

  }


  room=null;


  $("room")
   .classList.add("hidden");

  $("home")
   .classList.remove("hidden");


  homeStatus(
   "Ты вышел из комнаты.",
   "success"
  );

};


/* =========================================
   BUTTONS
========================================= */

$("createBtn").onclick=
 createRoom;

$("confirmJoin").onclick=
 joinRoom;


$("name").addEventListener(
 "keydown",
 e=>{

  if(e.key==="Enter")
   createRoom();

 }
);


$("joinCode").addEventListener(
 "keydown",
 e=>{

  if(e.key==="Enter")
   joinRoom();

 }
);

</script>

</body>
</html>
