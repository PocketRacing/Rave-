<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">

<title>Томас ❤️ Яна</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
*{box-sizing:border-box}

body{
 margin:0;
 background:#08090d;
 color:#fff;
 font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif
}

button,input{
 font:inherit
}

button{
 cursor:pointer
}

input{
 outline:none
}

.hidden{
 display:none!important
}

#app{
 width:100%;
 max-width:1000px;
 margin:auto;
 padding:14px
}

/* HOME */

.home{
 max-width:430px;
 margin:70px auto
}

.logo{
 text-align:center;
 font-size:30px;
 font-weight:900
}

.subtitle{
 text-align:center;
 color:#858b98;
 margin:7px 0 25px
}

.card{
 background:#11131a;
 border:1px solid #292d38;
 border-radius:20px;
 padding:20px
}

label{
 display:block;
 color:#9298a6;
 font-size:13px;
 margin-bottom:7px
}

input{
 width:100%;
 background:#080a0f;
 color:#fff;
 border:1px solid #343844;
 border-radius:11px;
 padding:14px
}

input:focus{
 border-color:#777cff
}

.btn{
 width:100%;
 border:0;
 border-radius:11px;
 padding:14px;
 margin-top:10px;
 font-weight:800
}

.primary{
 background:#fff;
 color:#000
}

.secondary{
 background:#1b1e27;
 color:#fff;
 border:1px solid #303541
}

.info{
 min-height:20px;
 margin-top:12px;
 text-align:center;
 font-size:13px;
 color:#9299a8;
 word-break:break-word
}

.error{
 color:#ff7882
}

.success{
 color:#73e0a0
}

/* ROOM */

.roomHead{
 display:flex;
 align-items:center;
 justify-content:space-between;
 gap:10px;
 margin:8px 0 14px
}

.roomTitle{
 font-size:21px;
 font-weight:900
}

.roomCode{
 margin-top:3px;
 font-size:12px;
 color:#858c9a
}

.roomCode b{
 color:#fff;
 letter-spacing:2px
}

.leave{
 border:0;
 border-radius:10px;
 padding:10px 13px;
 background:#29171b;
 color:#ff9da5
}

.layout{
 display:grid;
 grid-template-columns:minmax(0,1fr) 300px;
 gap:14px
}

/* VIDEO */

.video{
 width:100%;
 aspect-ratio:16/9;
 background:#000;
 border-radius:16px;
 overflow:hidden;
 display:flex;
 justify-content:center;
 align-items:center;
 text-align:center;
 color:#717887
}

.video iframe{
 width:100%;
 height:100%;
 border:0
}

.videoInput{
 display:flex;
 gap:7px;
 margin-top:9px
}

.videoInput input{
 min-width:0
}

.videoInput button{
 border:0;
 border-radius:10px;
 background:#fff;
 color:#000;
 padding:0 16px;
 font-weight:800
}

.controls{
 display:flex;
 gap:7px;
 margin-top:8px
}

.controls button{
 flex:1;
 border:0;
 border-radius:10px;
 padding:12px;
 background:#191d25;
 color:#fff
}

/* BOX */

.box{
 background:#11131a;
 border:1px solid #292d38;
 border-radius:15px;
 padding:13px
}

.boxTitle{
 font-weight:900;
 margin-bottom:10px
}

/* USERS */

.users{
 display:flex;
 flex-wrap:wrap;
 gap:6px
}

.user{
 background:#1b1f28;
 padding:7px 10px;
 border-radius:20px;
 font-size:13px
}

/* CHAT */

.chat{
 height:360px;
 margin-top:12px;
 display:flex;
 flex-direction:column
}

.messages{
 flex:1;
 overflow-y:auto;
 display:flex;
 flex-direction:column;
 gap:7px
}

.message{
 background:#1a1e27;
 padding:8px 10px;
 border-radius:9px;
 font-size:13px;
 word-break:break-word
}

.messageName{
 color:#9299a8;
 font-size:11px;
 font-weight:700;
 margin-bottom:3px
}

.send{
 display:flex;
 gap:6px;
 margin-top:8px
}

.send input{
 min-width:0
}

.send button{
 width:45px;
 border:0;
 border-radius:9px;
 background:#fff;
 color:#000;
 font-weight:900
}

/* MODAL */

.modal{
 position:fixed;
 inset:0;
 background:#000c;
 display:flex;
 align-items:center;
 justify-content:center;
 padding:18px;
 z-index:50
}

.modalCard{
 width:100%;
 max-width:390px;
 background:#11131a;
 border:1px solid #292d38;
 border-radius:18px;
 padding:20px
}

.modalCard h2{
 margin:0 0 18px
}

.close{
 float:right;
 border:0;
 background:none;
 color:#888;
 font-size:27px
}

@media(max-width:720px){

 .layout{
  grid-template-columns:1fr
 }

 .home{
  margin:40px auto
 }

 .chat{
  height:300px
 }

}

@media(max-width:430px){

 #app{
  padding:10px
 }

 .logo{
  font-size:27px
 }

 .roomTitle{
  font-size:18px
 }

}
</style>
</head>

<body>

<div id="app">

<!-- ================= HOME ================= -->

<section id="home">

 <div class="home">

  <div class="logo">
   Томас ❤️ Яна
  </div>

  <div class="subtitle">
   Комната для просмотра вместе
  </div>

  <div class="card">

   <label>Твоё имя</label>

   <input
    id="name"
    maxlength="20"
    autocomplete="off"
    placeholder="Томас"
   >

   <button
    id="createBtn"
    class="btn primary"
   >
    ❤️ Создать комнату
   </button>

   <button
    id="joinBtn"
    class="btn secondary"
   >
    🔑 Войти по коду
   </button>

   <div
    id="homeInfo"
    class="info"
   ></div>

  </div>

 </div>

</section>


<!-- ================= ROOM ================= -->

<section
 id="room"
 class="hidden"
>

 <div class="roomHead">

  <div>

   <div class="roomTitle">
    Томас ❤️ Яна
   </div>

   <div class="roomCode">
    Код комнаты:
    <b id="roomCode"></b>
   </div>

  </div>

  <button
   id="leaveBtn"
   class="leave"
  >
   Выйти
  </button>

 </div>


 <div class="layout">

  <main>

   <div
    id="video"
    class="video"
   >
    <div>
     🎬<br><br>
     Здесь появится видео VK
    </div>
   </div>


   <div class="videoInput">

    <input
     id="videoUrl"
     placeholder="Вставь ссылку или iframe VK"
    >

    <button id="videoBtn">
     OK
    </button>

   </div>


   <div class="controls">

    <button id="playBtn">
     ▶️ Смотреть
    </button>

    <button id="pauseBtn">
     ⏸ Пауза
    </button>

   </div>


   <div
    id="roomInfo"
    class="info"
   ></div>

  </main>


  <aside>

   <div class="box">

    <div class="boxTitle">
     👥 В комнате
    </div>

    <div
     id="users"
     class="users"
    ></div>

   </div>


   <div class="box chat">

    <div class="boxTitle">
     💬 Чат
    </div>

    <div
     id="messages"
     class="messages"
    ></div>

    <div class="send">

     <input
      id="message"
      maxlength="300"
      placeholder="Написать..."
     >

     <button id="sendBtn">
      ➤
     </button>

    </div>

   </div>

  </aside>

 </div>

</section>

</div>


<!-- ================= JOIN MODAL ================= -->

<div
 id="joinModal"
 class="modal hidden"
>

 <div class="modalCard">

  <button
   id="closeJoin"
   class="close"
  >
   ×
  </button>

  <h2>
   Войти в комнату
  </h2>

  <label>
   Код комнаты
  </label>

  <input
   id="joinCode"
   maxlength="6"
   autocomplete="off"
   placeholder="ABC123"
   style="text-transform:uppercase"
  >

  <button
   id="confirmJoin"
   class="btn primary"
  >
   Войти
  </button>

  <div
   id="joinInfo"
   class="info"
  ></div>

 </div>

</div>


<script>

/* ==================================================
   SUPABASE
================================================== */

const SUPABASE_URL =
"https://qyjvkiusyiylckaujjiv.supabase.co";

const SUPABASE_KEY =
"sb_publishable_dwxrSiVkIY5C8PKu--_UlA_phF5hvRy";

const supabaseClient =
window.supabase.createClient(
 SUPABASE_URL,
 SUPABASE_KEY
);


/* ==================================================
   STATE
================================================== */

let currentRoom=null;
let currentName="";

let roomChannel=null;
let usersChannel=null;
let messagesChannel=null;


/* ==================================================
   ELEMENT
================================================== */

const $=id=>
 document.getElementById(id);


/* ==================================================
   STATUS
================================================== */

function homeStatus(text,type=""){

 $("homeInfo").textContent=text;

 $("homeInfo").className=
  "info "+type;

}


function joinStatus(text,type=""){

 $("joinInfo").textContent=text;

 $("joinInfo").className=
  "info "+type;

}


function roomStatus(text,type=""){

 $("roomInfo").textContent=text;

 $("roomInfo").className=
  "info "+type;

}


/* ==================================================
   ROOM CODE
================================================== */

function generateCode(){

 const chars=
 "ABCDEFGHJKLMNPQRSTUVWXYZ23456789";

 let code="";

 for(let i=0;i<6;i++){

  code+=chars[
   Math.floor(
    Math.random()*chars.length
   )
  ];

 }

 return code;

}


/* ==================================================
   NAME
================================================== */

function getName(){

 const value=
  $("name").value.trim();

 if(!value){

  homeStatus(
   "❌ Введи своё имя",
   "error"
  );

  $("name").focus();

  return null;
 }

 return value.substring(0,20);

}


/* ==================================================
   CREATE ROOM
================================================== */

async function createRoom(){

 const name=getName();

 if(!name)return;

 currentName=name;

 $("createBtn").disabled=true;

 homeStatus(
  "Подключение к Supabase..."
 );


 try{

  /* Проверка подключения */

  const check=
   await supabaseClient
    .from("rooms")
    .select("id")
    .limit(1);


  if(check.error){

   throw new Error(
    "Supabase: "+
    check.error.message
   );

  }


  homeStatus(
   "Создаём комнату..."
  );


  const code=generateCode();


  const result=
   await supabaseClient
    .from("rooms")
    .insert({

     code:code,

     host_name:name,

     video_url:"",

     is_playing:false

    })
    .select()
    .single();


  if(result.error){

   throw new Error(
    "Создание комнаты: "+
    result.error.message
   );

  }


  currentRoom=result.data;


  const user=
   await supabaseClient
    .from("room_users")
    .insert({

     room_id:currentRoom.id,

     user_name:name

    });


  if(user.error){

   throw new Error(
    "Добавление пользователя: "+
    user.error.message
   );

  }


  openRoom();


 }catch(error){

  console.error(error);

  homeStatus(
   "❌ "+error.message,
   "error"
  );

 }finally{

  $("createBtn").disabled=false;

 }

}


/* ==================================================
   JOIN
================================================== */

$("joinBtn").onclick=()=>{

 $("joinModal")
  .classList.remove("hidden");

 $("joinCode").focus();

};


$("closeJoin").onclick=()=>{

 $("joinModal")
  .classList.add("hidden");

};


async function joinRoom(){

 const name=getName();

 if(!name)return;

 currentName=name;


 const code=
  $("joinCode")
   .value
   .trim()
   .toUpperCase();


 if(code.length!==6){

  joinStatus(
   "❌ Код должен содержать 6 символов",
   "error"
  );

  return;

 }


 joinStatus(
  "Ищем комнату..."
 );


 try{

  const result=
   await supabaseClient
    .from("rooms")
    .select("*")
    .eq("code",code)
    .maybeSingle();


  if(result.error){

   throw new Error(
    result.error.message
   );

  }


  if(!result.data){

   joinStatus(
    "❌ Комната не найдена",
    "error"
   );

   return;

  }


  currentRoom=result.data;


  const user=
   await supabaseClient
    .from("room_users")
    .insert({

     room_id:currentRoom.id,

     user_name:name

    });


  if(user.error){

   throw new Error(
    "Добавление пользователя: "+
    user.error.message
   );

  }


  $("joinModal")
   .classList.add("hidden");


  openRoom();


 }catch(error){

  console.error(error);

  joinStatus(
   "❌ "+error.message,
   "error"
  );

 }

}


/* ==================================================
   OPEN ROOM
================================================== */

async function openRoom(){

 $("home")
  .classList.add("hidden");

 $("room")
  .classList.remove("hidden");


 $("roomCode").textContent=
  currentRoom.code;


 $("videoUrl").value=
  currentRoom.video_url || "";


 renderVideo(
  currentRoom.video_url
 );


 await loadUsers();

 await loadMessages();

 subscribeRealtime();

}


/* ==================================================
   VIDEO
================================================== */

function renderVideo(value){

 if(!value){

  $("video").innerHTML=`
   <div>
    🎬<br><br>
    Вставь видео VK ниже
   </div>
  `;

  return;

 }


 let src=value.trim();


 /* Если вставлен iframe */

 if(src.includes("<iframe")){

  const match=
   src.match(
    /src=["']([^"']+)["']/
   );

  if(match)
   src=match[1];

 }


 if(
  !src.startsWith("http://") &&
  !src.startsWith("https://")
 ){

  $("video").innerHTML=`
   <div>
    ⚠️ Неверная ссылка или iframe
   </div>
  `;

  return;

 }


 const iframe=
  document.createElement("iframe");


 iframe.src=src;

 iframe.allow=
  "autoplay; encrypted-media; fullscreen; picture-in-picture";

 iframe.allowFullscreen=true;


 $("video").innerHTML="";

 $("video")
  .appendChild(iframe);

}


/* ==================================================
   SAVE VIDEO
================================================== */

$("videoBtn").onclick=
 async()=>{

  if(!currentRoom)return;


  const value=
   $("videoUrl")
    .value
    .trim();


  if(!value){

   roomStatus(
    "❌ Вставь видео VK",
    "error"
   );

   return;

  }


  const result=
   await supabaseClient
    .from("rooms")
    .update({

     video_url:value,

     is_playing:false

    })
    .eq("id",currentRoom.id)
    .select()
    .single();


  if(result.error){

   roomStatus(
    "❌ "+result.error.message,
    "error"
   );

   return;

  }


  currentRoom=result.data;

  renderVideo(value);

  roomStatus(
   "🎬 Видео добавлено",
   "success"
  );

};


/* ==================================================
   PLAY
================================================== */

$("playBtn").onclick=
 async()=>{

  if(!currentRoom)return;


  const result=
   await supabaseClient
    .from("rooms")
    .update({
     is_playing:true
    })
    .eq("id",currentRoom.id);


  if(result.error){

   roomStatus(
    "❌ "+result.error.message,
    "error"
   );

   return;

  }


  roomStatus(
   "▶️ Смотрим вместе",
   "success"
  );

};


/* ==================================================
   PAUSE
================================================== */

$("pauseBtn").onclick=
 async()=>{

  if(!currentRoom)return;


  const result=
   await supabaseClient
    .from("rooms")
    .update({
     is_playing:false
    })
    .eq("id",currentRoom.id);


  if(result.error){

   roomStatus(
    "❌ "+result.error.message,
    "error"
   );

   return;

  }


  roomStatus(
   "⏸ Пауза",
   "success"
  );

};


/* ==================================================
   USERS
================================================== */

async function loadUsers(){

 if(!currentRoom)return;


 const result=
  await supabaseClient
   .from("room_users")
   .select("*")
   .eq("room_id",currentRoom.id)
   .order("created_at");


 if(result.error){

  console.error(
   result.error
  );

  return;

 }


 $("users").innerHTML="";


 (result.data||[])
  .forEach(user=>{

   const div=
    document.createElement("div");

   div.className="user";

   div.textContent=
    "🟢 "+user.user_name;

   $("users")
    .appendChild(div);

  });

}


/* ==================================================
   MESSAGES
================================================== */

async function loadMessages(){

 if(!currentRoom)return;


 const result=
  await supabaseClient
   .from("messages")
   .select("*")
   .eq("room_id",currentRoom.id)
   .order("created_at")
   .limit(100);


 if(result.error){

  console.error(
   result.error
  );

  return;

 }


 $("messages").innerHTML="";


 (result.data||[])
  .forEach(renderMessage);


 scrollMessages();

}


function renderMessage(item){

 const div=
  document.createElement("div");

 div.className="message";


 const name=
  document.createElement("div");

 name.className=
  "messageName";

 name.textContent=
  item.user_name;


 const text=
  document.createElement("div");

 text.textContent=
  item.message;


 div.appendChild(name);

 div.appendChild(text);


 $("messages")
  .appendChild(div);


 scrollMessages();

}


function scrollMessages(){

 const box=
  $("messages");

 box.scrollTop=
  box.scrollHeight;

}


async function sendMessage(){

 if(!currentRoom)return;


 const input=
  $("message");

 const text=
  input.value.trim();


 if(!text)return;


 input.value="";


 const result=
  await supabaseClient
   .from("messages")
   .insert({

    room_id:currentRoom.id,

    user_name:currentName,

    message:text

   });


 if(result.error){

  roomStatus(
   "❌ "+result.error.message,
   "error"
  );

 }

}


$("sendBtn").onclick=
 sendMessage;


$("message").addEventListener(
 "keydown",
 e=>{

  if(e.key==="Enter")
   sendMessage();

 }
);


/* ==================================================
   REALTIME
================================================== */

function subscribeRealtime(){

 if(!currentRoom)return;


 /* ROOM */

 roomChannel=
  supabaseClient
   .channel(
    "room-"+currentRoom.id
   )
   .on(
    "postgres_changes",
    {
     event:"UPDATE",
     schema:"public",
     table:"rooms",
     filter:
      "id=eq."+currentRoom.id
    },
    payload=>{

     const old=
      currentRoom;

     currentRoom=
      payload.new;


     if(
      old.video_url !==
      currentRoom.video_url
     ){

      $("videoUrl").value=
       currentRoom.video_url || "";

      renderVideo(
       currentRoom.video_url
      );

     }


     if(
      old.is_playing !==
      currentRoom.is_playing
     ){

      roomStatus(
       currentRoom.is_playing
        ? "▶️ Яна/Томас включил просмотр"
        : "⏸ Поставили на паузу"
      );

     }

    }
   )
   .subscribe();


 /* USERS */

 usersChannel=
  supabaseClient
   .channel(
    "users-"+currentRoom.id
   )
   .on(
    "postgres_changes",
    {
     event:"*",
     schema:"public",
     table:"room_users",
     filter:
      "room_id=eq."+currentRoom.id
    },
    ()=>{
     loadUsers();
    }
   )
   .subscribe();


 /* CHAT */

 messagesChannel=
  supabaseClient
   .channel(
    "messages-"+currentRoom.id
   )
   .on(
    "postgres_changes",
    {
     event:"INSERT",
     schema:"public",
     table:"messages",
     filter:
      "room_id=eq."+currentRoom.id
    },
    payload=>{
     renderMessage(
      payload.new
     );
    }
   )
   .subscribe();

}


/* ==================================================
   LEAVE
================================================== */

$("leaveBtn").onclick=
 async()=>{

  if(!currentRoom)return;


  await supabaseClient
   .from("room_users")
   .delete()
   .eq(
    "room_id",
    currentRoom.id
   )
   .eq(
    "user_name",
    currentName
   );


  if(roomChannel)
   await supabaseClient
    .removeChannel(
     roomChannel
    );


  if(usersChannel)
   await supabaseClient
    .removeChannel(
     usersChannel
    );


  if(messagesChannel)
   await supabaseClient
    .removeChannel(
     messagesChannel
    );


  currentRoom=null;


  $("room")
   .classList.add("hidden");

  $("home")
   .classList.remove("hidden");


  homeStatus(
   "Ты вышел из комнаты",
   "success"
  );

};


/* ==================================================
   ENTER
================================================== */

$("name").addEventListener(
 "keydown",
 e=>{

  if(e.key==="Enter")
   createRoom();

 }
);


$("joinCode").addEventListener(
 "keydown",
 e=>{

  if(e.key==="Enter")
   $("confirmJoin").click();

 }
);


/* ==================================================
   BUTTONS
================================================== */

$("createBtn").onclick=
 createRoom;

$("confirmJoin").onclick=
 joinRoom;

</script>

</body>
</html>
