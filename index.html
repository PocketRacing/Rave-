<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">

<title>Томас ❤️ Яна</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
*{box-sizing:border-box}

body{
 margin:0;
 min-height:100vh;
 background:#08090d;
 color:#fff;
 font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif
}

button,input{
 font:inherit
}

button{
 cursor:pointer
}

#app{
 width:100%;
 max-width:900px;
 margin:auto;
 padding:15px
}

.card{
 background:#11131a;
 border:1px solid #292d38;
 border-radius:20px;
 padding:20px
}

.home{
 max-width:430px;
 margin:70px auto
}

.logo{
 text-align:center;
 font-size:30px;
 font-weight:900;
 margin-bottom:7px
}

.sub{
 text-align:center;
 color:#858b99;
 margin-bottom:25px
}

label{
 display:block;
 color:#9298a5;
 font-size:13px;
 margin-bottom:7px
}

input{
 width:100%;
 padding:14px;
 border-radius:12px;
 border:1px solid #343844;
 background:#080a0f;
 color:#fff;
 outline:none
}

input:focus{
 border-color:#777cff
}

.btn{
 width:100%;
 border:0;
 border-radius:12px;
 padding:14px;
 margin-top:10px;
 font-weight:800
}

.create{
 background:#fff;
 color:#000
}

.join{
 background:#1c2029;
 color:#fff;
 border:1px solid #303541
}

.info{
 margin-top:15px;
 min-height:20px;
 text-align:center;
 color:#9ca3b2;
 font-size:13px;
 word-break:break-word
}

.error{
 color:#ff7d87
}

.success{
 color:#75e0a1
}

.hidden{
 display:none!important
}

/* ROOM */

.roomTop{
 display:flex;
 justify-content:space-between;
 align-items:center;
 gap:10px;
 margin-bottom:15px
}

.title{
 font-size:21px;
 font-weight:900
}

.code{
 color:#888f9d;
 font-size:12px;
 margin-top:3px
}

.code b{
 color:#fff;
 letter-spacing:2px
}

.leave{
 border:0;
 border-radius:10px;
 padding:10px 13px;
 background:#2a171b;
 color:#ff9da4
}

.grid{
 display:grid;
 grid-template-columns:minmax(0,1fr) 300px;
 gap:14px
}

.video{
 aspect-ratio:16/9;
 width:100%;
 background:#000;
 border-radius:16px;
 overflow:hidden;
 display:flex;
 align-items:center;
 justify-content:center;
 color:#747b89;
 text-align:center
}

.video iframe{
 width:100%;
 height:100%;
 border:0
}

.videoInput{
 display:flex;
 gap:7px;
 margin-top:9px
}

.videoInput input{
 min-width:0
}

.videoInput button{
 border:0;
 background:#fff;
 color:#000;
 padding:0 15px;
 border-radius:10px;
 font-weight:800
}

.controls{
 display:flex;
 gap:7px;
 margin-top:8px
}

.controls button{
 flex:1;
 padding:12px;
 border:0;
 border-radius:10px;
 background:#191d25;
 color:#fff
}

.box{
 background:#11131a;
 border:1px solid #292d38;
 border-radius:15px;
 padding:13px
}

.boxTitle{
 font-weight:900;
 margin-bottom:10px
}

.users{
 display:flex;
 flex-wrap:wrap;
 gap:6px
}

.user{
 padding:7px 9px;
 border-radius:20px;
 background:#1b2029;
 font-size:13px
}

.chat{
 height:360px;
 display:flex;
 flex-direction:column
}

.messages{
 flex:1;
 overflow:auto;
 display:flex;
 flex-direction:column;
 gap:7px
}

.msg{
 background:#1b1f28;
 border-radius:9px;
 padding:8px 10px;
 font-size:13px;
 word-break:break-word
}

.msgName{
 color:#9299a8;
 font-size:11px;
 margin-bottom:3px;
 font-weight:700
}

.send{
 display:flex;
 gap:6px;
 margin-top:8px
}

.send input{
 min-width:0
}

.send button{
 width:45px;
 border:0;
 border-radius:9px;
 background:#fff;
 color:#000;
 font-weight:900
}

/* MODAL */

.modal{
 position:fixed;
 inset:0;
 background:#000c;
 display:flex;
 align-items:center;
 justify-content:center;
 padding:18px;
 z-index:100
}

.modalCard{
 width:100%;
 max-width:390px;
 background:#11131a;
 border:1px solid #292d38;
 border-radius:18px;
 padding:20px
}

.modalCard h2{
 margin:0 0 18px
}

.close{
 float:right;
 background:none;
 border:0;
 color:#888;
 font-size:27px
}

@media(max-width:700px){

 .grid{
  grid-template-columns:1fr
 }

 .home{
  margin:40px auto
 }

 .chat{
  height:300px
 }

}

@media(max-width:430px){

 #app{
  padding:10px
 }

 .logo{
  font-size:27px
 }

}
</style>
</head>

<body>

<div id="app">

<!-- HOME -->

<section id="home">

 <div class="home">

  <div class="logo">
   Томас ❤️ Яна
  </div>

  <div class="sub">
   Смотрим вместе
  </div>

  <div class="card">

   <label>Имя</label>

   <input
    id="name"
    maxlength="20"
    autocomplete="off"
    placeholder="Например: Томас"
   >

   <button
    class="btn create"
    id="createBtn"
   >
    ❤️ Создать комнату
   </button>

   <button
    class="btn join"
    id="joinBtn"
   >
    🔑 Войти по коду
   </button>

   <div
    id="homeInfo"
    class="info"
   ></div>

  </div>

 </div>

</section>


<!-- ROOM -->

<section
 id="room"
 class="hidden"
>

 <div class="roomTop">

  <div>

   <div class="title">
    Томас ❤️ Яна
   </div>

   <div class="code">
    Код:
    <b id="roomCode"></b>
   </div>

  </div>

  <button
   class="leave"
   id="leaveBtn"
  >
   Выйти
  </button>

 </div>


 <div class="grid">

  <div>

   <div
    id="video"
    class="video"
   >
    <div>
     🎬<br><br>
     Добавьте видео VK
    </div>
   </div>


   <div class="videoInput">

    <input
     id="videoUrl"
     placeholder="Ссылка или iframe VK"
    >

    <button id="videoBtn">
     OK
    </button>

   </div>


   <div class="controls">

    <button id="playBtn">
     ▶️ Смотреть
    </button>

    <button id="pauseBtn">
     ⏸ Пауза
    </button>

   </div>


   <div
    id="roomInfo"
    class="info"
   ></div>

  </div>


  <div>

   <div class="box">

    <div class="boxTitle">
     👥 В комнате
    </div>

    <div
     id="users"
     class="users"
    ></div>

   </div>


   <div
    class="box chat"
    style="margin-top:12px"
   >

    <div class="boxTitle">
     💬 Чат
    </div>

    <div
     id="messages"
     class="messages"
    ></div>

    <div class="send">

     <input
      id="message"
      maxlength="300"
      placeholder="Написать..."
     >

     <button id="sendBtn">
      ➤
     </button>

    </div>

   </div>

  </div>

 </div>

</section>

</div>


<!-- JOIN -->

<div
 id="joinModal"
 class="modal hidden"
>

 <div class="modalCard">

  <button
   class="close"
   id="closeJoin"
  >
   ×
  </button>

  <h2>Войти в комнату</h2>

  <label>Код комнаты</label>

  <input
   id="joinCode"
   maxlength="6"
   autocomplete="off"
   placeholder="ABC123"
   style="text-transform:uppercase"
  >

  <button
   class="btn create"
   id="confirmJoin"
  >
   Войти
  </button>

  <div
   id="joinInfo"
   class="info"
  ></div>

 </div>

</div>


<script>

/* =========================================
   SUPABASE
========================================= */

const SUPABASE_URL =
"https://qyjvkiusyiylckaujjiv.supabase.co";

const SUPABASE_KEY =
"sb_publishable_dwxrSiVkIY5C8PKu--_UlA_phF5hvRy";

const supabaseClient =
window.supabase.createClient(
 SUPABASE_URL,
 SUPABASE_KEY
);


/* =========================================
   STATE
========================================= */

let currentRoom=null;
let currentName="";

let roomChannel=null;
let usersChannel=null;
let messagesChannel=null;


/* =========================================
   HELPERS
========================================= */

const $=id=>
 document.getElementById(id);


function setHome(text,type=""){

 $("homeInfo").textContent=text;

 $("homeInfo").className=
  "info "+type;

}


function setJoin(text,type=""){

 $("joinInfo").textContent=text;

 $("joinInfo").className=
  "info "+type;

}


function setRoom(text,type=""){

 $("roomInfo").textContent=text;

 $("roomInfo").className=
  "info "+type;

}


function makeCode(){

 const chars=
 "ABCDEFGHJKLMNPQRSTUVWXYZ23456789";

 let code="";

 for(let i=0;i<6;i++){

  code+=chars[
   Math.floor(
    Math.random()*chars.length
   )
  ];

 }

 return code;

}


function getName(){

 const value=
  $("name").value.trim();

 if(!value){

  setHome(
   "Сначала введи имя",
   "error"
  );

  return null;
 }

 return value.substring(0,20);

}


/* =========================================
   CREATE
========================================= */

async function createRoom(){

 const name=getName();

 if(!name)return;

 currentName=name;

 setHome(
  "Подключаемся к Supabase..."
 );


 try{

  /*
   Проверяем таблицу
  */

  const check=
   await supabaseClient
    .from("rooms")
    .select("id")
    .limit(1);


  if(check.error){

   throw new Error(
    check.error.message
   );

  }


  setHome(
   "Создаём комнату..."
  );


  const roomCode=makeCode();


  const result=
   await supabaseClient
    .from("rooms")
    .insert({

     code:roomCode,

     host_name:name,

     video_url:"",

     is_playing:false

    })
    .select()
    .single();


  if(result.error){

   throw new Error(
    result.error.message
   );

  }


  currentRoom=result.data;


  const userResult=
   await supabaseClient
    .from("room_users")
    .insert({

     room_id:currentRoom.id,

     user_name:name

    });


  if(userResult.error){

   throw new Error(
    "Комната создана, но участник не добавился: "+
    userResult.error.message
   );

  }


  openRoom();


 }catch(error){

  console.error(error);

  setHome(
   "❌ "+error.message,
   "error"
  );

 }

}


/* =========================================
   JOIN
========================================= */

$("joinBtn").onclick=()=>{

 $("joinModal")
  .classList.remove("hidden");

 $("joinCode").focus();

};


$("closeJoin").onclick=()=>{

 $("joinModal")
  .classList.add("hidden");

};


$("confirmJoin").onclick=
 async()=>{

  const name=getName();

  if(!name)return;

  currentName=name;


  const code=
   $("joinCode")
    .value
    .trim()
    .toUpperCase();


  if(code.length!==6){

   setJoin(
    "Код должен содержать 6 символов",
    "error"
   );

   return;

  }


  setJoin(
   "Ищем комнату..."
  );


  try{

   const result=
    await supabaseClient
     .from("rooms")
     .select("*")
     .eq("code",code)
     .maybeSingle();


   if(result.error){

    throw new Error(
     result.error.message
    );

   }


   if(!result.data){

    setJoin(
     "❌ Такая комната не найдена",
     "error"
    );

    return;

   }


   currentRoom=result.data;


   const userResult=
    await supabaseClient
     .from("room_users")
     .insert({

      room_id:currentRoom.id,

      user_name:name

     });


   if(userResult.error){

    throw new Error(
     userResult.error.message
    );

   }


   $("joinModal")
    .classList.add("hidden");


   openRoom();


  }catch(error){

   console.error(error);

   setJoin(
    "❌ "+error.message,
    "error"
   );

  }

};


/* =========================================
   OPEN ROOM
========================================= */

async function openRoom(){

 $("home")
  .classList.add("hidden");

 $("room")
  .classList.remove("hidden");


 $("roomCode").textContent=
  currentRoom.code;


 $("videoUrl").value=
  currentRoom.video_url || "";


 renderVideo(
  currentRoom.video_url
 );


 await loadUsers();

 await loadMessages();

 subscribe();

}


/* =========================================
   VIDEO
========================================= */

function renderVideo(value){

 if(!value){

  $("video").innerHTML=`
   <div>
    🎬<br><br>
    Добавьте видео VK
   </div>
  `;

  return;

 }


 let src=value.trim();


 /*
  Поддержка полного iframe VK
 */

 if(src.includes("<iframe")){

  const match=
   src.match(
    /src=["']([^"']+)["']/
   );

  if(match){

   src=match[1];

  }

 }


 if(
  !src.startsWith("http://") &&
  !src.startsWith("https://")
 ){

  $("video").innerHTML=`
   <div>
    ⚠️ Неверная ссылка
   </div>
  `;

  return;

 }


 const iframe=
  document.createElement("iframe");


 iframe.src=src;

 iframe.allow=
  "autoplay; fullscreen; encrypted-media; picture-in-picture";

 iframe.allowFullscreen=true;


 $("video").innerHTML="";

 $("video").appendChild(
  iframe
 );

}


$("videoBtn").onclick=
 async()=>{

  if(!currentRoom)return;


  const value=
   $("videoUrl")
    .value
    .trim();


  if(!value){

   setRoom(
    "Вставь видео VK",
    "error"
   );

   return;

  }


  const result=
   await supabaseClient
    .from("rooms")
    .update({

     video_url:value,

     is_playing:false

    })
    .eq("id",currentRoom.id)
    .select()
    .single();


  if(result.error){

   setRoom(
    "❌ "+result.error.message,
    "error"
   );

   return;

  }


  currentRoom=result.data;

  renderVideo(value);

  setRoom(
   "🎬 Видео добавлено",
   "success"
  );

};


/* =========================================
   PLAY / PAUSE
========================================= */

$("playBtn").onclick=
 async()=>{

  if(!currentRoom)return;


  const result=
   await supabaseClient
    .from("rooms")
    .update({
     is_playing:true
    })
    .eq("id",currentRoom.id)
    .select()
    .single();


  if(result.error){

   setRoom(
    "❌ "+result.error.message,
    "error"
   );

   return;

  }


  currentRoom=result.data;

  setRoom(
   "▶️ Смотрим вместе",
   "success"
  );

};


$("pauseBtn").onclick=
 async()=>{

  if(!currentRoom)return;


  const result=
   await supabaseClient
    .from("rooms")
    .update({
     is_playing:false
    })
    .eq("id",currentRoom.id)
    .select()
    .single();


  if(result.error){

   setRoom(
    "❌ "+result.error.message,
    "error"
   );

   return;

  }


  currentRoom=result.data;

  setRoom(
   "⏸ Пауза",
   "success"
  );

};


/* =========================================
   USERS
========================================= */

async function loadUsers(){

 const result=
  await supabaseClient
   .from("room_users")
   .select("*")
   .eq("room_id",currentRoom.id)
   .order("created_at");


 if(result.error){

  console.error(
   result.error
  );

  return;

 }


 $("users").innerHTML="";


 (result.data||[])
  .forEach(user=>{

   const div=
    document.createElement("div");

   div.className="user";

   div.textContent=
    "🟢 "+user.user_name;

   $("users")
    .appendChild(div);

  });

}


/* =========================================
   CHAT
========================================= */

async function loadMessages(){

 const result=
  await supabaseClient
   .from("messages")
   .select("*")
   .eq("room_id",currentRoom.id)
   .order("created_at")
   .limit(100);


 if(result.error){

  console.error(
   result.error
  );

  return;

 }


 $("messages").innerHTML="";


 (result.data||[])
  .forEach(renderMessage);


 scrollMessages();

}


function renderMessage(item){

 const div=
  document.createElement("div");

 div.className="msg";


 const name=
  document.createElement("div");

 name.className="msgName";

 name.textContent=
  item.user_name;


 const text=
  document.createElement("div");

 text.textContent=
  item.message;


 div.appendChild(name);

 div.appendChild(text);


 $("messages")
  .appendChild(div);


 scrollMessages();

}


function scrollMessages(){

 const box=
  $("messages");

 box.scrollTop=
  box.scrollHeight;

}


async function sendMessage(){

 if(!currentRoom)return;


 const input=
  $("message");

 const text=
  input.value.trim();


 if(!text)return;


 input.value="";


 const result=
  await supabaseClient
   .from("messages")
   .insert({

    room_id:currentRoom.id,

    user_name:currentName,

    message:text

   });


 if(result.error){

  setRoom(
   "❌ "+result.error.message,
   "error"
  );

 }

}


$("sendBtn").onclick=
 sendMessage;


$("message").addEventListener(
 "keydown",
 e=>{

  if(e.key==="Enter")
   sendMessage();

 }
);


/* =========================================
   REALTIME
========================================= */

function subscribe(){

 roomChannel=
  supabaseClient
   .channel(
    "room-"+currentRoom.id
   )
   .on(
    "postgres_changes",
    {
     event:"UPDATE",
     schema:"public",
     table:"rooms",
     filter:
      "id=eq."+currentRoom.id
    },
    payload=>{

     const old=
      currentRoom;

     currentRoom=
      payload.new;


     if(
      old.video_url !==
      currentRoom.video_url
     ){

      $("videoUrl").value=
       currentRoom.video_url || "";

      renderVideo(
       currentRoom.video_url
      );

     }


     if(
      old.is_playing !==
      currentRoom.is_playing
     ){

      setRoom(
       currentRoom.is_playing
        ? "▶️ Видео запущено"
        : "⏸ Видео на паузе"
      );

     }

    }
   )
   .subscribe();


 usersChannel=
  supabaseClient
   .channel(
    "users-"+currentRoom.id
   )
   .on(
    "postgres_changes",
    {
     event:"*",
     schema:"public",
     table:"room_users",
     filter:
      "room_id=eq."+currentRoom.id
    },
    ()=>{
     loadUsers();
    }
   )
   .subscribe();


 messagesChannel=
  supabaseClient
   .channel(
    "messages-"+currentRoom.id
   )
   .on(
    "postgres_changes",
    {
     event:"INSERT",
     schema:"public",
     table:"messages",
     filter:
      "room_id=eq."+currentRoom.id
    },
    payload=>{
     renderMessage(
      payload.new
     );
    }
   )
   .subscribe();

}


/* =========================================
   LEAVE
========================================= */

$("leaveBtn").onclick=
 async()=>{

  if(!currentRoom)return;


  await supabaseClient
   .from("room_users")
   .delete()
   .eq(
    "room_id",
    currentRoom.id
   )
   .eq(
    "user_name",
    currentName
   );


  if(roomChannel)
   await supabaseClient
    .removeChannel(
     roomChannel
    );


  if(usersChannel)
   await supabaseClient
    .removeChannel(
     usersChannel
    );


  if(messagesChannel)
   await supabaseClient
    .removeChannel(
     messagesChannel
    );


  currentRoom=null;


  $("room")
   .classList.add("hidden");

  $("home")
   .classList.remove("hidden");


  setHome(
   "Ты вышел из комнаты",
   "success"
  );

};


/* =========================================
   ENTER KEYS
========================================= */

$("name").addEventListener(
 "keydown",
 e=>{

  if(e.key==="Enter")
   createRoom();

 }
);


$("joinCode").addEventListener(
 "keydown",
 e=>{

  if(e.key==="Enter")
   $("confirmJoin").click();

 }
);

</script>

</body>
</html>
