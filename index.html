<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">

<title>Томас ❤️ Яна</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
*{box-sizing:border-box}

body{
 margin:0;
 background:#08090d;
 color:#fff;
 font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif
}

button,input{
 font:inherit
}

button{
 cursor:pointer;
 border:0
}

.hidden{
 display:none!important
}

#app{
 width:100%;
 max-width:1050px;
 margin:auto;
 padding:14px
}

/* HOME */

.home{
 max-width:430px;
 margin:65px auto
}

.logo{
 text-align:center;
 font-size:30px;
 font-weight:900
}

.sub{
 text-align:center;
 color:#858c9a;
 margin:7px 0 25px
}

.card{
 background:#11131a;
 border:1px solid #292d38;
 border-radius:20px;
 padding:20px
}

label{
 display:block;
 color:#9299a7;
 font-size:13px;
 margin-bottom:7px
}

input{
 width:100%;
 padding:14px;
 border-radius:11px;
 border:1px solid #343844;
 background:#080a0f;
 color:#fff;
 outline:none
}

input:focus{
 border-color:#777cff
}

.mainBtn{
 width:100%;
 padding:14px;
 margin-top:10px;
 border-radius:11px;
 background:#fff;
 color:#000;
 font-weight:800
}

.darkBtn{
 background:#1b1f28;
 color:#fff
}

.info{
 margin-top:12px;
 color:#9299a7;
 font-size:13px;
 text-align:center;
 word-break:break-word
}

.error{
 color:#ff747e
}

.success{
 color:#70dfa0
}

/* ROOM */

.roomHead{
 display:flex;
 justify-content:space-between;
 align-items:center;
 gap:10px;
 margin:7px 0 14px
}

.roomTitle{
 font-size:22px;
 font-weight:900
}

.roomCode{
 color:#858c99;
 font-size:12px;
 margin-top:3px
}

.roomCode b{
 color:#fff;
 letter-spacing:3px
}

.leave{
 width:auto;
 margin:0;
 padding:10px 14px;
 background:#29171b;
 color:#ff9da5;
 border-radius:10px
}

.layout{
 display:grid;
 grid-template-columns:minmax(0,1fr) 310px;
 gap:14px
}

/* VIDEO */

.video{
 width:100%;
 aspect-ratio:16/9;
 background:#000;
 border-radius:16px;
 overflow:hidden;
 display:flex;
 align-items:center;
 justify-content:center;
 text-align:center;
 color:#747c8b
}

.video iframe{
 width:100%;
 height:100%;
 border:0
}

.videoEmpty{
 padding:20px;
 line-height:1.5
}

/* SEARCH */

.searchBox{
 margin-top:10px;
 background:#11131a;
 border:1px solid #292d38;
 border-radius:15px;
 padding:12px
}

.searchRow{
 display:flex;
 gap:7px
}

.searchRow input{
 min-width:0;
 flex:1
}

.searchBtn{
 width:52px;
 margin:0;
 padding:0;
 border-radius:11px;
 background:#fff;
 color:#000;
 font-weight:900
}

.searchHint{
 color:#707887;
 font-size:11px;
 line-height:1.4;
 margin-top:8px
}

.results{
 display:flex;
 flex-direction:column;
 gap:7px;
 margin-top:10px
}

.result{
 display:flex;
 align-items:center;
 gap:9px;
 padding:9px;
 background:#191d25;
 border:1px solid #292e38;
 border-radius:11px
}

.thumb{
 width:55px;
 height:42px;
 border-radius:7px;
 background:#252a34;
 display:flex;
 align-items:center;
 justify-content:center;
 flex-shrink:0
}

.resultInfo{
 flex:1;
 min-width:0
}

.resultTitle{
 font-size:13px;
 font-weight:800;
 white-space:nowrap;
 overflow:hidden;
 text-overflow:ellipsis
}

.resultSub{
 color:#858c99;
 font-size:11px;
 margin-top:3px
}

.watch{
 width:auto;
 margin:0;
 padding:8px 10px;
 background:#fff;
 color:#000;
 border-radius:8px;
 font-size:12px
}

/* USERS */

.box{
 background:#11131a;
 border:1px solid #292d38;
 border-radius:15px;
 padding:13px
}

.boxTitle{
 font-weight:900;
 margin-bottom:10px
}

.users{
 display:flex;
 flex-wrap:wrap;
 gap:6px
}

.user{
 background:#1b2029;
 padding:7px 10px;
 border-radius:20px;
 font-size:13px
}

/* CHAT */

.chat{
 height:380px;
 margin-top:12px;
 display:flex;
 flex-direction:column
}

.messages{
 flex:1;
 overflow-y:auto;
 display:flex;
 flex-direction:column;
 gap:7px
}

.message{
 background:#1b1f28;
 padding:8px 10px;
 border-radius:9px;
 font-size:13px;
 word-break:break-word
}

.messageName{
 color:#9299a7;
 font-size:11px;
 font-weight:700;
 margin-bottom:3px
}

.send{
 display:flex;
 gap:6px;
 margin-top:8px
}

.send input{
 min-width:0
}

.send button{
 width:48px;
 margin:0;
 padding:0;
 border-radius:10px;
 background:#fff;
 color:#000
}

/* MODAL */

.modal{
 position:fixed;
 inset:0;
 z-index:50;
 background:#000c;
 display:flex;
 align-items:center;
 justify-content:center;
 padding:18px
}

.modalCard{
 width:100%;
 max-width:390px
}

.close{
 float:right;
 width:auto;
 background:none;
 color:#888;
 font-size:26px;
 margin:0;
 padding:0
}

@media(max-width:760px){

 .layout{
  grid-template-columns:1fr
 }

 .home{
  margin:40px auto
 }

 .chat{
  height:300px
 }

}
</style>
</head>

<body>

<div id="app">

<!-- ================= HOME ================= -->

<section id="home">

 <div class="home">

  <div class="logo">
   Томас ❤️ Яна
  </div>

  <div class="sub">

  </div>

  <div class="card">

   <label>
    Твоё имя
   </label>

   <input

    maxlength="20"
    placeholder="Например: Томас"
    autocomplete="off"
   >

   <button
    id="createBtn"
    class="mainBtn"
   >
    ❤️ Создать комнату
   </button>

   <button
    id="joinBtn"
    class="mainBtn darkBtn"
   >
    🔑 Войти по коду
   </button>

   <div
    id="homeStatus"
    class="info"
   ></div>

  </div>

 </div>

</section>


<!-- ================= ROOM ================= -->

<section
 id="room"
 class="hidden"
>

 <div class="roomHead">

  <div>

   <div class="roomTitle">
    Томас ❤️ Яна
   </div>

   <div class="roomCode">
    Код комнаты:
    <b id="roomCode"></b>
   </div>

  </div>

  <button
   id="leaveBtn"
   class="leave"
  >
   Выйти
  </button>

 </div>


 <div class="layout">

  <main>

   <!-- VIDEO -->

   <div
    id="video"
    class="video"
   >

    <div class="videoEmpty">
     🎬<br><br>
     Найдите видео через поиск
    </div>

   </div>


   <!-- SEARCH -->

   <div class="searchBox">

    <div class="searchRow">

     <input
      id="search"
      placeholder="🔎 Найти видео..."
      autocomplete="off"
     >

     <button
      id="searchBtn"
      class="searchBtn"
     >
      🔍
     </button>

    </div>

    <div class="searchHint">
     Здесь будет общий поиск видео выбранного сервиса.
     YouTube и VK напрямую из браузера не используем.
    </div>

    <div
     id="results"
     class="results"
    ></div>

   </div>


   <!-- VIDEO EMBED -->

   <div
    style="
     margin-top:8px;
     background:#11131a;
     border:1px solid #292d38;
     border-radius:12px;
     padding:10px
    "
   >

    <div
     style="
      color:#858c99;
      font-size:11px;
      margin-bottom:6px
     "
    >
     Тест плеера: вставь готовый embed URL
    </div>

    <div class="searchRow">

     <input
      id="videoUrl"
      placeholder="https://..."
     >

     <button
      id="openVideo"
      class="searchBtn"
     >
      ▶
     </button>

    </div>

   </div>


   <div
    id="roomStatus"
    class="info"
   ></div>


   <!-- CHAT -->

   <div class="box chat">

    <div class="boxTitle">
     💬 Чат
    </div>

    <div
     id="messages"
     class="messages"
    ></div>

    <div class="send">

     <input
      id="message"
      maxlength="300"
      placeholder="Написать..."
     >

     <button id="sendBtn">
      ➤
     </button>

    </div>

   </div>

  </main>


  <aside>

   <div class="box">

    <div class="boxTitle">
     👥 В комнате
    </div>

    <div
     id="users"
     class="users"
    ></div>

   </div>

  </aside>

 </div>

</section>

</div>


<!-- ================= JOIN ================= -->

<div
 id="joinModal"
 class="modal hidden"
>

 <div class="card modalCard">

  <button
   id="closeJoin"
   class="close"
  >
   ×
  </button>

  <h2>
   Войти в комнату
  </h2>

  <label>
   Код комнаты
  </label>

  <input
   id="joinCode"
   maxlength="6"
   placeholder="ABC123"
   style="text-transform:uppercase"
  >

  <button
   id="confirmJoin"
   class="mainBtn"
  >
   Войти
  </button>

  <div
   id="joinStatus"
   class="info"
  ></div>

 </div>

</div>


<script>

/* ==========================================
   SUPABASE
========================================== */

const SUPABASE_URL=
"https://qyjvkiusyiylckaujjiv.supabase.co";

const SUPABASE_KEY=
"sb_publishable_dwxrSiVkIY5C8PKu--_UlA_phF5hvRy";

const db=
window.supabase.createClient(
 SUPABASE_URL,
 SUPABASE_KEY
);


/* ==========================================
   STATE
========================================== */

let room=null;

let currentName="";

let realtime=null;


/* ==========================================
   HELPERS
========================================== */

const $=
 id=>document.getElementById(id);


function homeStatus(text,type=""){

 $("homeStatus").textContent=text;

 $("homeStatus").className=
  "info "+type;

}


function roomStatus(text,type=""){

 $("roomStatus").textContent=text;

 $("roomStatus").className=
  "info "+type;

}


function joinStatus(text,type=""){

 $("joinStatus").textContent=text;

 $("joinStatus").className=
  "info "+type;

}


/* ==========================================
   ROOM CODE
========================================== */

function generateCode(){

 const chars=
 "ABCDEFGHJKLMNPQRSTUVWXYZ23456789";

 let result="";

 for(let i=0;i<6;i++){

  result+=chars[
   Math.floor(
    Math.random()*chars.length
   )
  ];

 }

 return result;

}


/* ==========================================
   CREATE ROOM
========================================== */

async function createRoom(){

 const enteredName=
  $("name").value.trim();


 if(!enteredName){

  homeStatus(
   "❌ Введи своё имя",
   "error"
  );

  return;

 }


 /*
  ВАЖНО:
  имя участника берётся только
  из текущего поля.
 */

 currentName=
  enteredName.substring(0,20);


 $("createBtn").disabled=true;


 homeStatus(
  "⏳ Создаём комнату..."
 );


 try{

  const roomCode=
   generateCode();


  const result=
   await db
    .from("rooms")
    .insert({

     code:roomCode,

     host_name:currentName,

     video_url:"",

     is_playing:false

    })
    .select()
    .single();


  if(result.error)
   throw result.error;


  room=result.data;


  /*
   Создатель комнаты тоже
   записывается как отдельный участник.
  */

  const participant=
   await db
    .from("room_users")
    .insert({

     room_id:room.id,

     user_name:currentName

    });


  if(participant.error)
   throw participant.error;


  openRoom();


 }catch(error){

  console.error(error);

  homeStatus(
   "❌ "+error.message,
   "error"
  );

 }finally{

  $("createBtn").disabled=false;

 }

}


/* ==========================================
   JOIN ROOM
========================================== */

async function joinRoom(){

 const enteredName=
  $("name").value.trim();


 const enteredCode=
  $("joinCode")
   .value
   .trim()
   .toUpperCase();


 if(!enteredName){

  joinStatus(
   "❌ Сначала введи своё имя",
   "error"
  );

  return;

 }


 if(enteredCode.length!==6){

  joinStatus(
   "❌ Код должен содержать 6 символов",
   "error"
  );

  return;

 }


 /*
  ВАЖНО:
  здесь НЕ используется host_name.
  Имя Яны берётся именно
  из поля имени на её устройстве.
 */

 currentName=
  enteredName.substring(0,20);


 joinStatus(
  "⏳ Ищем комнату..."
 );


 try{

  const result=
   await db
    .from("rooms")
    .select("*")
    .eq(
     "code",
     enteredCode
    )
    .maybeSingle();


  if(result.error)
   throw result.error;


  if(!result.data){

   joinStatus(
    "❌ Комната не найдена",
    "error"
   );

   return;

  }


  room=result.data;


  const participant=
   await db
    .from("room_users")
    .insert({

     room_id:room.id,

     user_name:currentName

    });


  if(participant.error)
   throw participant.error;


  $("joinModal")
   .classList.add("hidden");


  openRoom();


 }catch(error){

  console.error(error);

  joinStatus(
   "❌ "+error.message,
   "error"
  );

 }

}


/* ==========================================
   OPEN ROOM
========================================== */

async function openRoom(){

 $("home")
  .classList.add("hidden");


 $("room")
  .classList.remove("hidden");


 $("roomCode").textContent=
  room.code;


 if(room.video_url){

  renderVideo(
   room.video_url
  );

 }


 await loadUsers();

 await loadMessages();

 subscribeRealtime();

}


/* ==========================================
   SEARCH UI
========================================== */

function searchVideo(){

 const query=
  $("search")
   .value
   .trim();


 if(!query){

  roomStatus(
   "🔎 Введи название видео."
  );

  return;

 }


 /*
  Это НЕ фальшивый запрос к VK.
  Пока настоящий видеосервис API
  не подключён, мы честно показываем
  поисковую карточку.
 */

 $("results").innerHTML="";


 const result=
  document.createElement("div");


 result.className=
  "result";


 result.innerHTML=`

  <div class="thumb">
   🎬
  </div>

  <div class="resultInfo">

   <div class="resultTitle">
    ${escapeHtml(query)}
   </div>

   <div class="resultSub">
    Источник видео ещё не подключён
   </div>

  </div>

  <button class="watch">
   Выбрать
  </button>

 `;


 result
  .querySelector(".watch")
  .onclick=()=>{

   roomStatus(
    "Для этого результата пока нужен embed-адрес видео."
   );

   $("videoUrl").focus();

  };


 $("results")
  .appendChild(result);


 roomStatus(
  "🔎 Интерфейс поиска работает. Осталось подключить реальный источник видео."
 );

}


$("searchBtn").onclick=
 searchVideo;


$("search").addEventListener(
 "keydown",
 e=>{

  if(e.key==="Enter")
   searchVideo();

 }
);


/* ==========================================
   HTML ESCAPE
========================================== */

function escapeHtml(text){

 return text
  .replaceAll("&","&amp;")
  .replaceAll("<","&lt;")
  .replaceAll(">","&gt;")
  .replaceAll('"',"&quot;")
  .replaceAll("'","&#039;");

}


/* ==========================================
   VIDEO
========================================== */

function renderVideo(value){

 if(!value){

  $("video").innerHTML=`
   <div class="videoEmpty">
    🎬<br><br>
    Найдите видео через поиск
   </div>
  `;

  return;

 }


 let src=
  value.trim();


 /*
  Поддержка iframe.
 */

 if(src.includes("<iframe")){

  const match=
   src.match(
    /src=["']([^"']+)["']/
   );

  if(match)
   src=match[1];

 }


 if(
  !src.startsWith("https://") &&
  !src.startsWith("http://")
 ){

  $("video").innerHTML=`
   <div class="videoEmpty">
    ❌ Неверный адрес плеера
   </div>
  `;

  return;

 }


 const iframe=
  document.createElement("iframe");


 iframe.src=src;

 iframe.allow=
  "autoplay; fullscreen; encrypted-media; picture-in-picture";

 iframe.allowFullscreen=true;


 $("video").innerHTML="";

 $("video")
  .appendChild(iframe);

}


/* ==========================================
   SAVE VIDEO
========================================== */

$("openVideo").onclick=
 async()=>{

  if(!room)return;


  const value=
   $("videoUrl")
    .value
    .trim();


  if(!value){

   roomStatus(
    "❌ Вставь embed-адрес.",
    "error"
   );

   return;

  }


  const result=
   await db
    .from("rooms")
    .update({
     video_url:value
    })
    .eq(
     "id",
     room.id
    )
    .select()
    .single();


  if(result.error){

   roomStatus(
    "❌ "+result.error.message,
    "error"
   );

   return;

  }


  room=result.data;


  renderVideo(value);


  roomStatus(
   "🎬 Видео выбрано и отправлено в комнату.",
   "success"
  );

};


/* ==========================================
   USERS
========================================== */

async function loadUsers(){

 if(!room)return;


 const result=
  await db
   .from("room_users")
   .select("*")
   .eq(
    "room_id",
    room.id
   )
   .order(
    "created_at",
    {ascending:true}
   );


 if(result.error){

  console.error(result.error);

  return;

 }


 $("users").innerHTML="";


 (result.data||[])
  .forEach(user=>{

   const el=
    document.createElement("div");

   el.className="user";

   el.textContent=
    "🟢 "+user.user_name;

   $("users")
    .appendChild(el);

  });

}


/* ==========================================
   CHAT
========================================== */

async function loadMessages(){

 if(!room)return;


 const result=
  await db
   .from("messages")
   .select("*")
   .eq(
    "room_id",
    room.id
   )
   .order(
    "created_at",
    {ascending:true}
   )
   .limit(100);


 if(result.error){

  console.error(result.error);

  return;

 }


 $("messages").innerHTML="";


 (result.data||[])
  .forEach(renderMessage);


 scrollChat();

}


function renderMessage(item){

 const el=
  document.createElement("div");

 el.className=
  "message";


 const n=
  document.createElement("div");

 n.className=
  "messageName";

 n.textContent=
  item.user_name;


 const t=
  document.createElement("div");

 t.textContent=
  item.message;


 el.appendChild(n);

 el.appendChild(t);


 $("messages")
  .appendChild(el);

}


function scrollChat(){

 $("messages").scrollTop=
  $("messages").scrollHeight;

}


async function sendMessage(){

 if(!room)return;


 const input=
  $("message");


 const text=
  input.value.trim();


 if(!text)return;


 input.value="";


 const result=
  await db
   .from("messages")
   .insert({

    room_id:room.id,

    user_name:currentName,

    message:text

   });


 if(result.error){

  roomStatus(
   "❌ Чат: "+
   result.error.message,
   "error"
  );

 }

}


$("sendBtn").onclick=
 sendMessage;


$("message").addEventListener(
 "keydown",
 e=>{

  if(e.key==="Enter")
   sendMessage();

 }
);


/* ==========================================
   REALTIME
========================================== */

function subscribeRealtime(){

 if(!room)return;


 realtime=
  db
   .channel(
    "room-"+room.id
   )

   .on(
    "postgres_changes",
    {
     event:"UPDATE",
     schema:"public",
     table:"rooms",
     filter:
      "id=eq."+room.id
    },
    payload=>{

     room=
      payload.new;


     if(room.video_url){

      renderVideo(
       room.video_url
      );

     }

    }
   )

   .on(
    "postgres_changes",
    {
     event:"INSERT",
     schema:"public",
     table:"room_users",
     filter:
      "room_id=eq."+room.id
    },
    ()=>{
     loadUsers();
    }
   )

   .on(
    "postgres_changes",
    {
     event:"DELETE",
     schema:"public",
     table:"room_users",
     filter:
      "room_id=eq."+room.id
    },
    ()=>{
     loadUsers();
    }
   )

   .on(
    "postgres_changes",
    {
     event:"INSERT",
     schema:"public",
     table:"messages",
     filter:
      "room_id=eq."+room.id
    },
    payload=>{

     renderMessage(
      payload.new
     );

     scrollChat();

    }
   )

   .subscribe();

}


/* ==========================================
   LEAVE
========================================== */

$("leaveBtn").onclick=
 async()=>{

  if(room){

   await db
    .from("room_users")
    .delete()
    .eq(
     "room_id",
     room.id
    )
    .eq(
     "user_name",
     currentName
    );

  }


  if(realtime){

   await db
    .removeChannel(
     realtime
    );

  }


  room=null;


  $("room")
   .classList.add("hidden");


  $("home")
   .classList.remove("hidden");


  setHome(
   "Ты вышел из комнаты.",
   "success"
  );

};


/* ==========================================
   JOIN MODAL
========================================== */

$("confirmJoin").onclick=
 joinRoom;


$("closeJoin").onclick=
 ()=>{

  $("joinModal")
   .classList.add("hidden");

 };


/* ==========================================
   OPEN JOIN
========================================== */

$("joinBtn").onclick=
 ()=>{

  $("joinModal")
   .classList.remove("hidden");

  $("joinCode").focus();

 };


/* ==========================================
   KEYBOARD
========================================== */

$("name").addEventListener(
 "keydown",
 e=>{

  if(e.key==="Enter")
   createRoom();

 }
);


$("joinCode").addEventListener(
 "keydown",
 e=>{

  if(e.key==="Enter")
   joinRoom();

 }
);
