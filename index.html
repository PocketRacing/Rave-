<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Томас ❤️ Яна</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
*{box-sizing:border-box}

body{
 margin:0;
 min-height:100vh;
 background:#090a0f;
 color:#fff;
 font-family:Arial,Helvetica,sans-serif
}

button,input{
 font:inherit
}

button{
 border:0;
 cursor:pointer
}

.app{
 width:100%;
 max-width:950px;
 margin:auto;
 padding:15px
}

.hidden{display:none!important}

/* HOME */

.home{
 max-width:430px;
 margin:70px auto 0;
 text-align:center
}

.logo{
 font-size:31px;
 font-weight:900;
 margin-bottom:7px
}

.subtitle{
 color:#9298a6;
 margin-bottom:25px
}

.card{
 background:#11131a;
 border:1px solid #252936;
 border-radius:18px;
 padding:18px;
 text-align:left
}

label{
 display:block;
 color:#9298a6;
 font-size:13px;
 margin:0 0 7px
}

input{
 width:100%;
 background:#090b10;
 border:1px solid #303442;
 border-radius:11px;
 color:#fff;
 padding:14px;
 outline:none
}

input:focus{
 border-color:#777cff
}

.btn{
 width:100%;
 padding:14px;
 margin-top:9px;
 border-radius:11px;
 font-weight:800
}

.primary{
 background:#fff;
 color:#08090c
}

.secondary{
 background:#1b1e27;
 color:#fff;
 border:1px solid #303442
}

.status{
 color:#7e8696;
 text-align:center;
 font-size:12px;
 min-height:18px;
 margin-top:12px
}

/* ROOM */

.roomHead{
 display:flex;
 align-items:center;
 justify-content:space-between;
 gap:10px;
 margin:10px 0 14px
}

.roomTitle{
 font-size:21px;
 font-weight:900
}

.roomCode{
 color:#858c9b;
 font-size:12px;
 margin-top:4px
}

.roomCode b{
 color:#fff;
 letter-spacing:2px
}

.leave{
 background:#29171a;
 color:#ff9da4;
 padding:10px 13px;
 border-radius:10px
}

.layout{
 display:grid;
 grid-template-columns:minmax(0,1fr) 300px;
 gap:14px
}

/* VIDEO */

.videoBox{
 width:100%;
 aspect-ratio:16/9;
 background:#000;
 border-radius:16px;
 overflow:hidden;
 display:flex;
 align-items:center;
 justify-content:center;
 color:#727987;
 text-align:center
}

.videoBox iframe{
 width:100%;
 height:100%;
 border:0
}

.videoAdd{
 display:flex;
 gap:7px;
 margin-top:9px
}

.videoAdd input{
 margin:0
}

.videoAdd button{
 background:#fff;
 color:#000;
 padding:0 15px;
 border-radius:10px;
 font-weight:800
}

.controls{
 display:flex;
 gap:8px;
 margin-top:9px
}

.controls button{
 flex:1;
 background:#191d26;
 color:#fff;
 border-radius:10px;
 padding:12px
}

/* PANELS */

.panel{
 display:flex;
 flex-direction:column;
 gap:12px
}

.panelBox{
 background:#11131a;
 border:1px solid #252936;
 border-radius:15px;
 padding:14px
}

.panelTitle{
 font-weight:900;
 margin-bottom:10px
}

/* USERS */

.users{
 display:flex;
 flex-wrap:wrap;
 gap:6px
}

.user{
 background:#1b1f28;
 padding:7px 10px;
 border-radius:20px;
 font-size:13px
}

/* CHAT */

.chat{
 height:350px;
 display:flex;
 flex-direction:column
}

.messages{
 flex:1;
 overflow:auto;
 display:flex;
 flex-direction:column;
 gap:7px
}

.message{
 background:#1a1e27;
 padding:8px 10px;
 border-radius:9px;
 font-size:13px;
 word-break:break-word
}

.message b{
 display:block;
 font-size:11px;
 color:#9299aa;
 margin-bottom:3px
}

.chatSend{
 display:flex;
 gap:6px;
 margin-top:8px
}

.chatSend input{
 margin:0
}

.chatSend button{
 width:45px;
 border-radius:9px;
 background:#fff;
 color:#000;
 font-weight:900
}

/* MODAL */

.modal{
 position:fixed;
 inset:0;
 background:#000b;
 display:flex;
 align-items:center;
 justify-content:center;
 padding:18px;
 z-index:20
}

.modalBox{
 width:100%;
 max-width:400px;
 background:#11131a;
 border:1px solid #292e3a;
 border-radius:18px;
 padding:18px
}

.modalBox h2{
 margin-top:0
}

.close{
 float:right;
 background:none;
 color:#888;
 font-size:26px
}

/* MOBILE */

@media(max-width:750px){

 .layout{
  grid-template-columns:1fr
 }

 .home{
  margin-top:45px
 }

 .chat{
  height:300px
 }

}

@media(max-width:450px){

 .app{
  padding:10px
 }

 .logo{
  font-size:27px
 }

 .roomTitle{
  font-size:18px
 }

 .roomHead{
  align-items:flex-start
 }

 .videoAdd input{
  min-width:0
 }

}
</style>
</head>

<body>

<div class="app">

<section id="home">

 <div class="home">

  <div class="logo">
   Томас ❤️ Яна
  </div>

  <div class="subtitle">
   Смотрим вместе
  </div>

  <div class="card">

   <label>Твоё имя</label>

   <input
    id="name"
    maxlength="20"
    placeholder="Томас или Яна"
   >

   <button
    class="btn primary"
    onclick="createRoom()"
   >
    ❤️ Создать комнату
   </button>

   <button
    class="btn secondary"
    onclick="openJoin()"
   >
    🔑 Войти по коду
   </button>

   <div
    id="homeStatus"
    class="status"
   ></div>

  </div>

 </div>

</section>


<section
 id="room"
 class="hidden"
>

 <div class="roomHead">

  <div>

   <div class="roomTitle">
    Томас ❤️ Яна
   </div>

   <div class="roomCode">
    Комната:
    <b id="roomCode"></b>
   </div>

  </div>

  <button
   class="leave"
   onclick="leaveRoom()"
  >
   Выйти
  </button>

 </div>


 <div class="layout">

  <main>

   <div
    id="videoBox"
    class="videoBox"
   >
    <div>
     🎬<br><br>
     Здесь появится видео VK
    </div>
   </div>


   <div class="videoAdd">

    <input
     id="videoUrl"
     placeholder="Вставь ссылку или iframe VK"
    >

    <button onclick="setVideo()">
     OK
    </button>

   </div>


   <div class="controls">

    <button onclick="playVideo()">
     ▶️ Смотреть
    </button>

    <button onclick="pauseVideo()">
     ⏸ Пауза
    </button>

   </div>


   <div
    id="roomStatus"
    class="status"
   ></div>

  </main>


  <aside class="panel">

   <div class="panelBox">

    <div class="panelTitle">
     👥 В комнате
    </div>

    <div
     id="users"
     class="users"
    ></div>

   </div>


   <div class="panelBox chat">

    <div class="panelTitle">
     💬 Чат
    </div>

    <div
     id="messages"
     class="messages"
    ></div>

    <div class="chatSend">

     <input
      id="message"
      maxlength="300"
      placeholder="Написать..."
     >

     <button onclick="sendMessage()">
      ➤
     </button>

    </div>

   </div>

  </aside>

 </div>

</section>

</div>


<div
 id="joinModal"
 class="modal hidden"
>

 <div class="modalBox">

  <button
   class="close"
   onclick="closeJoin()"
  >
   ×
  </button>

  <h2>Войти в комнату</h2>

  <label>Код комнаты</label>

  <input
   id="joinCode"
   maxlength="6"
   placeholder="ABC123"
   style="text-transform:uppercase"
  >

  <button
   class="btn primary"
   onclick="joinRoom()"
  >
   Войти
  </button>

  <div
   id="joinStatus"
   class="status"
  ></div>

 </div>

</div>


<script>

/* ================================
   SUPABASE
================================ */

const SUPABASE_URL =
"https://qyjvkiusyiylckaujjiv.supabase.co";

const SUPABASE_KEY =
"sb_publishable_dwxrSiVkIY5C8PKu--_UlA_phF5hvRy";

const db =
window.supabase.createClient(
 SUPABASE_URL,
 SUPABASE_KEY
);


/* ================================
   STATE
================================ */

let room=null;
let myName="";

let roomChannel=null;
let userChannel=null;
let messageChannel=null;


/* ================================
   HELPERS
================================ */

function $(id){
 return document.getElementById(id);
}

function show(id){
 $(id).classList.remove("hidden");
}

function hide(id){
 $(id).classList.add("hidden");
}

function generateCode(){

 const chars=
 "ABCDEFGHJKLMNPQRSTUVWXYZ23456789";

 let result="";

 for(let i=0;i<6;i++){

  result+=chars[
   Math.floor(
    Math.random()*chars.length
   )
  ];

 }

 return result;
}

function getName(){

 const value=
  $("name").value.trim();

 if(!value){

  alert("Введите имя");

  return null;
 }

 return value.substring(0,20);
}

function status(text){

 $("roomStatus").textContent=text;

 setTimeout(()=>{

  $("roomStatus").textContent="";

 },2500);

}


/* ================================
   CREATE ROOM
================================ */

async function createRoom(){

 myName=getName();

 if(!myName)return;

 $("homeStatus").textContent=
 "Создаём комнату...";


 let roomCode=generateCode();


 const {data,error}=await db
  .from("rooms")
  .insert({

   code:roomCode,

   host_name:myName,

   video_url:"",

   is_playing:false

  })
  .select()
  .single();


 if(error){

  console.error(error);

  $("homeStatus").textContent=
   "Ошибка: "+error.message;

  return;
 }


 room=data;

 await addUser();

 openRoom();

}


/* ================================
   JOIN
================================ */

function openJoin(){

 show("joinModal");

 $("joinCode").focus();

}

function closeJoin(){

 hide("joinModal");

}

async function joinRoom(){

 myName=getName();

 if(!myName)return;


 const roomCode=
  $("joinCode")
   .value
   .trim()
   .toUpperCase();


 if(roomCode.length!==6){

  $("joinStatus").textContent=
   "Введите 6 символов";

  return;
 }


 $("joinStatus").textContent=
 "Ищем комнату...";


 const {data,error}=await db
  .from("rooms")
  .select("*")
  .eq("code",roomCode)
  .maybeSingle();


 if(error){

  $("joinStatus").textContent=
   error.message;

  return;
 }


 if(!data){

  $("joinStatus").textContent=
   "Комната не найдена";

  return;
 }


 room=data;

 await addUser();

 closeJoin();

 openRoom();

}


/* ================================
   OPEN ROOM
================================ */

async function openRoom(){

 hide("home");

 show("room");


 $("roomCode").textContent=
  room.code;


 $("videoUrl").value=
  room.video_url || "";


 renderVideo(
  room.video_url
 );


 await loadUsers();

 await loadMessages();

 subscribeRealtime();

}


/* ================================
   VK VIDEO
================================ */

function renderVideo(value){

 if(!value){

  $("videoBox").innerHTML=`
   <div>
    🎬<br><br>
    Здесь появится видео VK
   </div>
  `;

  return;
 }


 let src=value.trim();


 /*
   Можно вставить iframe VK.
 */

 if(src.includes("<iframe")){

  const match=
   src.match(
    /src=["']([^"']+)["']/
   );

  if(match){

   src=match[1];

  }

 }


 if(
  !src.startsWith("http://") &&
  !src.startsWith("https://")
 ){

  $("videoBox").innerHTML=`
   <div>
    ⚠️ Неверная ссылка
   </div>
  `;

  return;
 }


 const iframe=
  document.createElement("iframe");


 iframe.src=src;

 iframe.allow=
  "autoplay; encrypted-media; fullscreen; picture-in-picture";

 iframe.allowFullscreen=true;


 $("videoBox").innerHTML="";

 $("videoBox").appendChild(
  iframe
 );

}


/* ================================
   SET VIDEO
================================ */

async function setVideo(){

 const value=
  $("videoUrl").value.trim();


 if(!value){

  alert("Вставь видео VK");

  return;
 }


 const {data,error}=await db
  .from("rooms")
  .update({

   video_url:value,

   is_playing:false

  })
  .eq("id",room.id)
  .select()
  .single();


 if(error){

  console.error(error);

  status("Ошибка сохранения");

  return;
 }


 room=data;

 renderVideo(value);

 status("🎬 Видео добавлено");

}


/* ================================
   PLAY / PAUSE
================================ */

async function playVideo(){

 const {data,error}=await db
  .from("rooms")
  .update({
   is_playing:true
  })
  .eq("id",room.id)
  .select()
  .single();


 if(error){

  console.error(error);

  status("Ошибка");

  return;
 }

 room=data;

 status("▶️ Смотрим вместе");

}


async function pauseVideo(){

 const {data,error}=await db
  .from("rooms")
  .update({
   is_playing:false
  })
  .eq("id",room.id)
  .select()
  .single();


 if(error){

  console.error(error);

  status("Ошибка");

  return;
 }

 room=data;

 status("⏸ Пауза");

}


/* ================================
   USERS
================================ */

async function addUser(){

 await db
  .from("room_users")
  .delete()
  .eq("room_id",room.id)
  .eq("user_name",myName);


 const {error}=await db
  .from("room_users")
  .insert({

   room_id:room.id,

   user_name:myName

  });


 if(error)
  console.error(error);

}


async function loadUsers(){

 const {data,error}=await db
  .from("room_users")
  .select("*")
  .eq("room_id",room.id)
  .order("created_at");


 if(error){

  console.error(error);

  return;
 }


 $("users").innerHTML="";


 (data||[]).forEach(user=>{

  const div=
   document.createElement("div");

  div.className="user";

  div.textContent=
   "🟢 "+user.user_name;

  $("users").appendChild(div);

 });

}


/* ================================
   CHAT
================================ */

async function loadMessages(){

 const {data,error}=await db
  .from("messages")
  .select("*")
  .eq("room_id",room.id)
  .order("created_at")
  .limit(100);


 if(error){

  console.error(error);

  return;
 }


 $("messages").innerHTML="";


 (data||[]).forEach(
  renderMessage
 );


 scrollChat();

}


function renderMessage(item){

 const div=
  document.createElement("div");

 div.className="message";


 const b=
  document.createElement("b");

 b.textContent=
  item.user_name;


 const text=
  document.createElement("span");

 text.textContent=
  item.message;


 div.appendChild(b);

 div.appendChild(text);

 $("messages").appendChild(div);


 scrollChat();

}


async function sendMessage(){

 const input=
  $("message");

 const text=
  input.value.trim();


 if(!text)return;


 input.value="";


 const {error}=await db
  .from("messages")
  .insert({

   room_id:room.id,

   user_name:myName,

   message:text

  });


 if(error){

  console.error(error);

  status("Ошибка отправки");

 }

}


function scrollChat(){

 const box=
  $("messages");

 box.scrollTop=
  box.scrollHeight;

}


/* ================================
   REALTIME
================================ */

function subscribeRealtime(){

 roomChannel=
  db.channel(
   "room-"+room.id
  );


 roomChannel.on(

  "postgres_changes",

  {
   event:"UPDATE",
   schema:"public",
   table:"rooms",
   filter:"id=eq."+room.id
  },

  payload=>{

   const old=room;

   room=payload.new;


   if(
    old.video_url !==
    room.video_url
   ){

    $("videoUrl").value=
     room.video_url || "";

    renderVideo(
     room.video_url
    );

    status("🎬 Видео изменилось");

   }


   if(
    old.is_playing !==
    room.is_playing
   ){

    status(
     room.is_playing
      ? "▶️ Видео запущено"
      : "⏸ Видео остановлено"
    );

   }

  }

 );


 roomChannel.subscribe();


 userChannel=
  db.channel(
   "users-"+room.id
  );


 userChannel.on(

  "postgres_changes",

  {
   event:"*",
   schema:"public",
   table:"room_users",
   filter:"room_id=eq."+room.id
  },

  ()=>{
   loadUsers();
  }

 );


 userChannel.subscribe();


 messageChannel=
  db.channel(
   "messages-"+room.id
  );


 messageChannel.on(

  "postgres_changes",

  {
   event:"INSERT",
   schema:"public",
   table:"messages",
   filter:"room_id=eq."+room.id
  },

  payload=>{

   renderMessage(
    payload.new
   );

  }

 );


 messageChannel.subscribe();

}


/* ================================
   LEAVE
================================ */

async function leaveRoom(){

 if(!room)return;


 await db
  .from("room_users")
  .delete()
  .eq("room_id",room.id)
  .eq("user_name",myName);


 if(roomChannel)
  await db.removeChannel(
   roomChannel
  );


 if(userChannel)
  await db.removeChannel(
   userChannel
  );


 if(messageChannel)
  await db.removeChannel(
   messageChannel
  );


 room=null;


 hide("room");

 show("home");


 $("users").innerHTML="";
 $("messages").innerHTML="";

}


/* ================================
   ENTER
================================ */

$("message").addEventListener(
 "keydown",
 e=>{
  if(e.key==="Enter")
   sendMessage();
 }
);


$("joinCode").addEventListener(
 "keydown",
 e=>{
  if(e.key==="Enter")
   joinRoom();
 }
);


/* ================================
   AUTO ROOM FROM URL
================================ */

window.addEventListener(
 "load",
 ()=>{

  const params=
   new URLSearchParams(
    location.search
   );

  const code=
   params.get("room");

  if(code){

   $("joinCode").value=
    code.toUpperCase();

  }

 }
);

</script>

</body>
</html>
