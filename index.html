<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Томас ❤️ Яна</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
*{box-sizing:border-box}
body{
 margin:0;
 background:#090a0f;
 color:#fff;
 font-family:Arial,sans-serif;
}
button,input{
 font:inherit;
}
button{
 border:0;
 cursor:pointer;
}
.app{
 max-width:900px;
 margin:auto;
 padding:18px;
}
.hidden{display:none!important}

.logo{
 text-align:center;
 font-size:28px;
 font-weight:900;
 margin:35px 0 5px;
}
.subtitle{
 text-align:center;
 color:#8f94a3;
 margin-bottom:25px;
}

.card{
 background:#11131a;
 border:1px solid #252936;
 border-radius:18px;
 padding:18px;
}
.home{
 max-width:430px;
 margin:auto;
}
label{
 display:block;
 color:#8f94a3;
 font-size:13px;
 margin:10px 0 6px;
}
input{
 width:100%;
 padding:14px;
 background:#090b10;
 border:1px solid #303442;
 color:#fff;
 border-radius:11px;
 outline:none;
}
input:focus{
 border-color:#777cff;
}

.btn{
 width:100%;
 padding:14px;
 border-radius:11px;
 font-weight:800;
 margin-top:9px;
}
.primary{
 background:#fff;
 color:#08090d;
}
.secondary{
 background:#1b1e27;
 color:#fff;
 border:1px solid #303442;
}

.roomTop{
 display:flex;
 align-items:center;
 justify-content:space-between;
 gap:10px;
 margin-bottom:14px;
}
.roomTitle{
 font-size:21px;
 font-weight:900;
}
.roomCode{
 color:#8f94a3;
 font-size:12px;
 margin-top:3px;
}
.leave{
 background:#29171a;
 color:#ff9ba1;
 padding:9px 12px;
 border-radius:9px;
}

.grid{
 display:grid;
 grid-template-columns:1fr 300px;
 gap:14px;
}

.video{
 background:#000;
 border-radius:15px;
 overflow:hidden;
 aspect-ratio:16/9;
 display:flex;
 align-items:center;
 justify-content:center;
 color:#747b89;
 text-align:center;
}
.video iframe{
 width:100%;
 height:100%;
 border:0;
}

.videoInput{
 margin-top:10px;
 display:flex;
 gap:7px;
}
.videoInput input{
 margin:0;
}
.videoInput button{
 padding:0 15px;
 border-radius:10px;
 background:#fff;
 color:#000;
 font-weight:800;
}

.controls{
 display:flex;
 gap:8px;
 margin-top:9px;
}
.controls button{
 flex:1;
 padding:12px;
 border-radius:10px;
 background:#1a1d26;
 color:#fff;
}

.panel{
 display:flex;
 flex-direction:column;
 gap:12px;
}

.panelBox{
 background:#11131a;
 border:1px solid #252936;
 border-radius:15px;
 padding:14px;
}

.title{
 font-weight:900;
 margin-bottom:10px;
}

.users{
 display:flex;
 flex-wrap:wrap;
 gap:6px;
}
.user{
 background:#1b1f28;
 padding:7px 10px;
 border-radius:20px;
 font-size:13px;
}

.chat{
 height:320px;
 display:flex;
 flex-direction:column;
}
.messages{
 flex:1;
 overflow:auto;
 display:flex;
 flex-direction:column;
 gap:7px;
}
.message{
 background:#1a1e27;
 padding:8px 10px;
 border-radius:9px;
 font-size:13px;
}
.message b{
 display:block;
 font-size:11px;
 color:#9299aa;
 margin-bottom:3px;
}
.chatSend{
 display:flex;
 gap:6px;
 margin-top:8px;
}
.chatSend input{
 margin:0;
}
.chatSend button{
 width:44px;
 border-radius:9px;
 background:#fff;
 color:#000;
 font-weight:900;
}

.status{
 text-align:center;
 color:#777f90;
 font-size:12px;
 min-height:18px;
 margin-top:10px;
}

.modal{
 position:fixed;
 inset:0;
 background:#000b;
 display:flex;
 align-items:center;
 justify-content:center;
 padding:20px;
 z-index:10;
}
.modalBox{
 width:100%;
 max-width:400px;
 background:#11131a;
 border:1px solid #292e3a;
 border-radius:18px;
 padding:18px;
}
.close{
 float:right;
 background:none;
 color:#888;
 font-size:25px;
}

@media(max-width:750px){
 .grid{
  grid-template-columns:1fr;
 }
 .panel{
  display:flex;
 }
}

@media(max-width:500px){
 .app{
  padding:11px;
 }
 .logo{
  margin-top:22px;
 }
 .roomTitle{
  font-size:18px;
 }
}
</style>
</head>

<body>

<div class="app">

<!-- ГЛАВНЫЙ ЭКРАН -->
<section id="home">

 <div class="logo">Томас ❤️ Яна</div>
 <div class="subtitle">Смотрим вместе</div>

 <div class="card home">

  <label>Твоё имя</label>
  <input id="name" maxlength="20" placeholder="Томас или Яна">

  <button class="btn primary" onclick="createRoom()">
   ❤️ СОЗДАТЬ КОМНАТУ
  </button>

  <button class="btn secondary" onclick="openJoin()">
   🔑 ВОЙТИ В КОМНАТУ
  </button>

  <div id="homeStatus" class="status"></div>

 </div>

</section>


<!-- КОМНАТА -->
<section id="room" class="hidden">

 <div class="roomTop">

  <div>
   <div class="roomTitle">❤️ Томас + Яна</div>
   <div class="roomCode">
    Код комнаты: <b id="roomCode"></b>
   </div>
  </div>

  <button class="leave" onclick="leaveRoom()">
   Выйти
  </button>

 </div>


 <div class="grid">

  <!-- ВИДЕО -->
  <main>

   <div class="video" id="video">
    <div>
     🎬<br><br>
     Добавьте видео VK
    </div>
   </div>

   <div class="videoInput">

    <input
     id="videoUrl"
     placeholder="Вставь ссылку VK или iframe-код"
    >

    <button onclick="setVideo()">
     OK
    </button>

   </div>

   <div class="controls">

    <button onclick="syncPlay()">
     ▶️
    </button>

    <button onclick="syncPause()">
     ⏸
    </button>

   </div>

   <div id="status" class="status"></div>

  </main>


  <!-- БОКОВАЯ ПАНЕЛЬ -->
  <aside class="panel">

   <div class="panelBox">

    <div class="title">
     👥 Сейчас смотрят
    </div>

    <div id="users" class="users"></div>

   </div>


   <div class="panelBox chat">

    <div class="title">
     💬 Чат
    </div>

    <div id="messages" class="messages"></div>

    <div class="chatSend">

     <input
      id="message"
      maxlength="300"
      placeholder="Написать..."
     >

     <button onclick="sendMessage()">
      ➤
     </button>

    </div>

   </div>

  </aside>

 </div>

</section>

</div>


<!-- ВХОД ПО КОДУ -->
<div id="joinModal" class="modal hidden">

 <div class="modalBox">

  <button class="close" onclick="closeJoin()">×</button>

  <h2>Войти в комнату</h2>

  <label>Код комнаты</label>

  <input
   id="joinCode"
   maxlength="6"
   placeholder="ABC123"
   style="text-transform:uppercase"
  >

  <button class="btn primary" onclick="joinRoom()">
   ВОЙТИ
  </button>

  <div id="joinStatus" class="status"></div>

 </div>

</div>


<script>

/* =====================================================
   SUPABASE
   ===================================================== */

const SUPABASE_URL = "ВСТАВЬ_SUPABASE_URL";
const SUPABASE_KEY = "ВСТАВЬ_SUPABASE_ANON_KEY";

const db = window.supabase.createClient(
 SUPABASE_URL,
 SUPABASE_KEY
);


/* =====================================================
   ПЕРЕМЕННЫЕ
   ===================================================== */

let room = null;
let myName = "";
let roomChannel = null;
let userChannel = null;
let messageChannel = null;


/* =====================================================
   HELPERS
   ===================================================== */

function $(id){
 return document.getElementById(id);
}

function show(id){
 $(id).classList.remove("hidden");
}

function hide(id){
 $(id).classList.add("hidden");
}

function randomCode(){

 const chars =
 "ABCDEFGHJKLMNPQRSTUVWXYZ23456789";

 let code="";

 for(let i=0;i<6;i++){
  code += chars[
   Math.floor(Math.random()*chars.length)
  ];
 }

 return code;
}

function getName(){

 const name=$("name").value.trim();

 if(!name){
  alert("Напиши своё имя");
  return null;
 }

 return name.substring(0,20);
}

function notify(text){

 $("status").textContent=text;

 setTimeout(()=>{
  $("status").textContent="";
 },2500);

}


/* =====================================================
   СОЗДАНИЕ КОМНАТЫ
   ===================================================== */

async function createRoom(){

 myName=getName();

 if(!myName)return;

 $("homeStatus").textContent="Создаём комнату...";

 const code=randomCode();

 const {data,error}=await db
  .from("rooms")
  .insert({
   code:code,
   host_name:myName,
   video_url:"",
   is_playing:false
  })
  .select()
  .single();

 if(error){

  console.error(error);

  $("homeStatus").textContent=
   "Ошибка: "+error.message;

  return;
 }

 room=data;

 await addUser();

 openRoom();

}


/* =====================================================
   ВХОД
   ===================================================== */

function openJoin(){
 show("joinModal");
 $("joinCode").focus();
}

function closeJoin(){
 hide("joinModal");
}

async function joinRoom(){

 myName=getName();

 if(!myName)return;

 const code=$("joinCode")
  .value
  .trim()
  .toUpperCase();

 if(code.length!==6){

  $("joinStatus").textContent=
   "Код должен быть из 6 символов";

  return;
 }

 $("joinStatus").textContent=
  "Ищем комнату...";

 const {data,error}=await db
  .from("rooms")
  .select("*")
  .eq("code",code)
  .maybeSingle();

 if(error){

  $("joinStatus").textContent=
   error.message;

  return;
 }

 if(!data){

  $("joinStatus").textContent=
   "Такой комнаты нет";

  return;
 }

 room=data;

 await addUser();

 closeJoin();

 openRoom();

}


/* =====================================================
   ОТКРЫТЬ КОМНАТУ
   ===================================================== */

async function openRoom(){

 hide("home");
 show("room");

 $("roomCode").textContent=
  room.code;

 $("videoUrl").value=
  room.video_url || "";

 renderVideo(room.video_url);

 await loadUsers();
 await loadMessages();

 subscribe();

}


/* =====================================================
   VK VIDEO
   ===================================================== */

function renderVideo(value){

 if(!value){

  $("video").innerHTML=`
   <div>
    🎬<br><br>
    Добавьте видео VK
   </div>
  `;

  return;
 }


 /*
   Если вставлен iframe-код VK,
   извлекаем src.
 */

 let src="";

 if(value.includes("<iframe")){

  const match=value.match(
   /src=["']([^"']+)["']/
  );

  if(match){
   src=match[1];
  }

 }else{

  /*
    Если это уже ссылка на iframe,
    используем её напрямую.
  */

  src=value;
 }


 if(!src){

  $("video").innerHTML=`
   <div>
    ⚠️ Не удалось определить VK-плеер.<br><br>
    Лучше вставить код iframe из VK.
   </div>
  `;

  return;
 }


 $("video").innerHTML=`
  <iframe
   src="${escapeHtml(src)}"
   allow="autoplay; encrypted-media; fullscreen; picture-in-picture"
   allowfullscreen>
  </iframe>
 `;
}


function escapeHtml(text){

 return text
  .replace(/&/g,"&amp;")
  .replace(/"/g,"&quot;")
  .replace(/</g,"&lt;")
  .replace(/>/g,"&gt;");
}


/* =====================================================
   УСТАНОВИТЬ ВИДЕО
   ===================================================== */

async function setVideo(){

 const value=$("videoUrl").value.trim();

 if(!value){

  alert("Вставь видео VK");

  return;
 }


 const {data,error}=await db
  .from("rooms")
  .update({
   video_url:value,
   is_playing:false
  })
  .eq("id",room.id)
  .select()
  .single();


 if(error){

  console.error(error);

  notify("Ошибка сохранения");

  return;
 }

 room=data;

 renderVideo(value);

 notify("Видео добавлено ❤️");

}


/* =====================================================
   PLAY / PAUSE
   ===================================================== */

async function syncPlay(){

 await db
  .from("rooms")
  .update({
   is_playing:true
  })
  .eq("id",room.id);

 notify("▶️ Смотрим вместе");
}


async function syncPause(){

 await db
  .from("rooms")
  .update({
   is_playing:false
  })
  .eq("id",room.id);

 notify("⏸ Пауза");
}


/* =====================================================
   ПОЛЬЗОВАТЕЛИ
   ===================================================== */

async function addUser(){

 await db
  .from("room_users")
  .delete()
  .eq("room_id",room.id)
  .eq("user_name",myName);

 await db
  .from("room_users")
  .insert({
   room_id:room.id,
   user_name:myName
  });

}


async function loadUsers(){

 const {data}=await db
  .from("room_users")
  .select("*")
  .eq("room_id",room.id)
  .order("created_at");

 renderUsers(data||[]);
}


function renderUsers(list){

 $("users").innerHTML="";

 list.forEach(user=>{

  const div=document.createElement("div");

  div.className="user";

  div.textContent=
   (user.user_name===myName?"🟢 ":"⚪ ")
   +user.user_name;

  $("users").appendChild(div);

 });

}


/* =====================================================
   ЧАТ
   ===================================================== */

async function loadMessages(){

 const {data}=await db
  .from("messages")
  .select("*")
  .eq("room_id",room.id)
  .order("created_at")
  .limit(100);

 $("messages").innerHTML="";

 (data||[]).forEach(renderMessage);

 scrollChat();
}


function renderMessage(message){

 const div=document.createElement("div");

 div.className="message";

 const name=document.createElement("b");
 name.textContent=message.user_name;

 const text=document.createElement("span");
 text.textContent=message.message;

 div.appendChild(name);
 div.appendChild(text);

 $("messages").appendChild(div);

 scrollChat();
}


async function sendMessage(){

 const input=$("message");

 const text=input.value.trim();

 if(!text)return;

 input.value="";

 const {error}=await db
  .from("messages")
  .insert({
   room_id:room.id,
   user_name:myName,
   message:text
  });

 if(error){

  console.error(error);

  notify("Ошибка отправки");

 }

}


function scrollChat(){

 $("messages").scrollTop=
  $("messages").scrollHeight;

}


/* =====================================================
   REALTIME
   ===================================================== */

function subscribe(){

 roomChannel=db
  .channel("room-"+room.id)

  .on(
   "postgres_changes",
   {
    event:"UPDATE",
    schema:"public",
    table:"rooms",
    filter:"id=eq."+room.id
   },
   payload=>{

    const old=room;

    room=payload.new;

    /*
      Новое видео
    */

    if(
     old.video_url !==
     room.video_url
    ){

     $("videoUrl").value=
      room.video_url || "";

     renderVideo(room.video_url);

     notify("🎬 Видео изменилось");

    }


    /*
      Синхронизация Play/Pause
    */

    if(
     old.is_playing !==
     room.is_playing
    ){

     notify(
      room.is_playing
       ? "▶️ Смотрим"
       : "⏸ Пауза"
     );

    }

   }
  )

  .subscribe();


 userChannel=db
  .channel("users-"+room.id)

  .on(
   "postgres_changes",
   {
    event:"*",
    schema:"public",
    table:"room_users",
    filter:"room_id=eq."+room.id
   },
   ()=>{
    loadUsers();
   }
  )

  .subscribe();


 messageChannel=db
  .channel("messages-"+room.id)

  .on(
   "postgres_changes",
   {
    event:"INSERT",
    schema:"public",
    table:"messages",
    filter:"room_id=eq."+room.id
   },
   payload=>{

    renderMessage(payload.new);

   }
  )

  .subscribe();

}


/* =====================================================
   ВЫХОД
   ===================================================== */

async function leaveRoom(){

 if(!room)return;

 await db
  .from("room_users")
  .delete()
  .eq("room_id",room.id)
  .eq("user_name",myName);


 if(roomChannel)
  await db.removeChannel(roomChannel);

 if(userChannel)
  await db.removeChannel(userChannel);

 if(messageChannel)
  await db.removeChannel(messageChannel);


 room=null;

 hide("room");
 show("home");

 $("messages").innerHTML="";
 $("users").innerHTML="";

}


/* =====================================================
   ENTER
   ===================================================== */

$("message").addEventListener(
 "keydown",
 e=>{
  if(e.key==="Enter")
   sendMessage();
 }
);

$("joinCode").addEventListener(
 "keydown",
 e=>{
  if(e.key==="Enter")
   joinRoom();
 }
);

</script>

</body>
</html>
